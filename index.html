<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRICKS QUEST V6 PRO - Final</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#02020a;color:#fff;font-family:'Orbitron',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;max-width:480px;background:#0a0a1a;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:2px solid #1a1a3a}
.logo{font-size:14px;font-weight:900;letter-spacing:1px;color:#00f2ff;text-shadow:0 0 10px #00f2ff}
.stats{display:flex;gap:12px;font-size:11px}
.stat{color:#aaa} .stat b{color:#fff}
.controls{display:flex;gap:8px}
.cbtn{width:36px;height:36px;border-radius:10px;background:#151530;border:1px solid #2a2a5a;color:#fff;font-size:16px;cursor:pointer}
.game-wrap{position:relative;width:100%;max-width:480px;flex:1;background:radial-gradient(circle at center,#101030 0%,#02020a 100%);overflow:hidden}
#brickArea{position:absolute;top:0;left:0;width:100%;height:75%;padding:6px;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:48px;gap:6px}
.brick{display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;font-weight:900;border:2px solid rgba(255,255,255,0.2);box-shadow:0 0 12px currentColor;transition:transform 0.1s;animation:spawn 0.3s ease}
@keyframes spawn{from{transform:scale(0)} to{transform:scale(1)}}
.brick.hit{transform:scale(1.2)}
.brick.g1{background:linear-gradient(135deg,#0f5,#0a3);color:#fff;box-shadow:0 0 12px #0f5}
.brick.g2{background:linear-gradient(135deg,#ff0,#fa0);color:#000;box-shadow:0 0 12px #ff0}
.brick.g3{background:linear-gradient(135deg,#f80,#f00);color:#fff;box-shadow:0 0 15px #f80}
.brick.g4{background:linear-gradient(135deg,#f0f,#80f);color:#fff;box-shadow:0 0 18px #f0f}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.footer{width:100%;max-width:480px;background:#0a0a1a;padding:10px;border-top:2px solid #1a1a3a;display:flex;justify-content:space-between;align-items:center}
.balls{font-size:14px;color:#00f2ff}
.adbtn{background:linear-gradient(90deg,#00f2ff,#7000ff);border:none;padding:10px 18px;border-radius:20px;color:#fff;font-family:'Orbitron';font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 0 15px #00f2ff}
.power{display:flex;gap:10px}
.pbtn{width:44px;height:44px;border-radius:50%;border:2px solid #333;background:#151530;font-size:20px;cursor:pointer}
/* MODALS */
.modal{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal.show{display:flex}
.card{background:linear-gradient(180deg,#121230,#0a0a1a);border:2px solid #00f2ff;border-radius:20px;padding:24px;width:100%;max-width:340px;text-align:center;box-shadow:0 0 40px rgba(0,242,255,0.3)}
.card h2{color:#00f2ff;margin-bottom:8px;font-size:18px}
.card p{color:#aaa;font-size:12px;margin-bottom:16px;line-height:1.5}
.timer{font-size:32px;color:#fff;margin:12px 0;text-shadow:0 0 10px #fff}
.claim{width:100%;padding:14px;background:#222;border-radius:12px;border:1px solid #333;color:#666;font-family:'Orbitron';font-weight:700;cursor:not-allowed;transition:0.3s}
.claim.ready{background:linear-gradient(90deg,#00f2ff,#7000ff);color:#fff;border:none;cursor:pointer;box-shadow:0 0 20px #00f2ff}
.aim-line{position:absolute;pointer-events:none;border-top:2px dashed rgba(255,255,255,0.3)}
</style>
</head>
<body>
<div class="header">
<div class="logo">BRICKS QUEST V6</div>
<div class="stats">
<div class="stat">STAGE-<b id="stage">1</b></div>
<div class="stat">LINE <b id="line">1/10</b></div>
<div class="stat">BEST <b id="best">0</b></div>
</div>
<div class="controls">
<button class="cbtn" id="soundBtn">🔊</button>
<button class="cbtn" id="fsBtn">⛶</button>
</div>
</div>

<div class="game-wrap" id="gameWrap">
<div id="brickArea"></div>
<canvas id="canvas"></canvas>
<div class="modal" id="adModal">
<div class="card">
<p id="adTop">Ad - <span id="adCount">5</span>s</p>
<h2>Sponsored</h2>
<div style="background:#000;border-radius:12px;padding:30px 10px;margin:12px 0;border:1px dashed #333">
<div style="font-size:28px">📺</div>
<div style="color:#555;font-size:11px;margin-top:8px">Advertisement will appear here<br>Reward after full view</div>
</div>
<p>Watch full ad to get +50 Balls</p>
<div class="timer" id="timer">5</div>
<button class="claim" id="claimBtn">Wait...</button>
</div>
</div>
<div class="modal" id="overModal">
<div class="card">
<h2 style="color:#ff0040">Game Over!</h2>
<p>Line reached bottom. Try again!</p>
<p style="font-size:24px;color:#fff">Stage: <span id="overStage">1</span></p>
<button class="claim ready" onclick="resetGame()">Play Again</button>
</div>
</div>
</div>

<div class="footer">
<div class="balls">⚪ x<span id="ballCount">100</span></div>
<button class="adbtn" id="watchAd">📺 Watch Ad +50 Balls</button>
<div class="power">
<button class="pbtn" id="fireBtn">⚡</button>
<button class="pbtn">💖</button>
</div>
</div>

<script>
let stage=1, line=1, balls=100, best=localStorage.getItem('bq_best')||0;
document.getElementById('best').textContent=best;
let bricks=[], isAiming=false, aimStart=null, aimEnd=null;
const brickArea=document.getElementById('brickArea');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,dpr;
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;dpr=window.devicePixelRatio;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
resize(); window.addEventListener('resize',resize);
let ballObjs=[], particles=[], shooting=false, shootX=W/2, shootY=H-20;
let soundOn=true;
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d,v=0.2){if(!soundOn) return; try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.value=v; o.start(); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d); o.stop(audioCtx.currentTime+d);}catch(e){}}

function getColorClass(n){
 if(n<=15) return 'g1';
 if(n<=35) return 'g2';
 if(n<=55) return 'g3';
 return 'g4';
}
function createLevel(){
 brickArea.innerHTML=''; bricks=[];
 let rows=line;
 for(let r=0;r<rows;r++){
  for(let c=0;c<7;c++){
   if(Math.random()<0.55){
    const val=Math.floor(stage*5 + Math.random()*20 + 5);
    const div=document.createElement('div');
    div.className='brick '+getColorClass(val);
    div.textContent=val;
    div.dataset.val=val; div.dataset.r=r; div.dataset.c=c;
    brickArea.appendChild(div);
    bricks.push({el:div,val,r,c,x:c,y:r});
   }
  }
 }
}
function updateUI(){
 document.getElementById('stage').textContent=stage;
 document.getElementById('line').textContent=line+'/10';
 document.getElementById('ballCount').textContent=balls;
}
function checkGameOver(){
 if(line>=10){ document.getElementById('overStage').textContent=stage; document.getElementById('overModal').classList.add('show'); if(stage>best){best=stage;localStorage.setItem('bq_best',best); document.getElementById('best').textContent=best;} return true; }
 return false;
}
function nextLine(){
 line++; stage=Math.floor(line/3)+1;
 if(checkGameOver()) return;
 createLevel(); updateUI();
}

function spawnParticles(x,y,color){
 for(let i=0;i<8;i++){ particles.push({x,y,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12,life:20,color}); }
}
function shoot(angle){
 if(shooting) return;
 shooting=true; ballObjs=[];
 let count=balls;
 let idx=0;
 const interval=setInterval(()=>{
  if(idx>=count){clearInterval(interval); return;}
  ballObjs.push({x:shootX,y:shootY,vx:Math.cos(angle)*14,vy:Math.sin(angle)*14,active:true});
  beep(600+Math.random()*200,0.08,0.15);
  idx++;
  if(idx>=count){
   clearInterval(interval);
  }
 }, 40);
}

let lastTime=0;
function loop(t){
 requestAnimationFrame(loop);
 ctx.clearRect(0,0,W,H);
 // aim line
 if(isAiming && aimStart && aimEnd){
  ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(aimStart.x,aimStart.y);
  const ang=Math.atan2(aimEnd.y-aimStart.y, aimEnd.x-aimStart.x);
  const len=200; ctx.lineTo(aimStart.x+Math.cos(ang)*len, aimStart.y+Math.sin(ang)*len); ctx.stroke(); ctx.setLineDash([]);
  // dot preview
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(aimStart.x+Math.cos(ang)*len, aimStart.y+Math.sin(ang)*len,6,0,Math.PI*2); ctx.fill();
 }
 // balls
 for(let b of ballObjs){
  if(!b.active) continue;
  b.x+=b.vx; b.y+=b.vy;
  if(b.x<8 || b.x>W-8){b.vx*=-1; beep(300,0.05); b.x=Math.max(8,Math.min(W-8,b.x));}
  if(b.y<8){b.vy*=-1; beep(300,0.05); b.y=8;}
  // brick collision
  for(let br of bricks){
   if(br.val<=0) continue;
   const rect=br.el.getBoundingClientRect();
   const wrapRect=document.getElementById('gameWrap').getBoundingClientRect();
   const bx=rect.left-wrapRect.left+rect.width/2;
   const by=rect.top-wrapRect.top+rect.height/2;
   const dx=b.x-bx, dy=b.y-by;
   if(Math.abs(dx)<rect.width/2+10 && Math.abs(dy)<rect.height/2+10){
    br.val--; br.el.textContent=br.val; br.el.classList.add('hit'); setTimeout(()=>br.el.classList.remove('hit'),100);
    br.el.className='brick '+getColorClass(br.val);
    if(br.val<=0){ br.el.style.visibility='hidden'; spawnParticles(b.x,b.y,br.el.style.color); beep(900,0.15,0.3); }
    else beep(500,0.06);
    b.vy*=-1; b.vx+=(Math.random()-0.5)*2;
    break;
   }
  }
  if(b.y>H){ b.active=false; }
  ctx.fillStyle='#fff'; ctx.shadowColor='#00f2ff'; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(b.x,b.y,8,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
 }
 // particles
 for(let i=particles.length-1;i>=0;i--){let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--; ctx.fillStyle=p.color||'#ff0'; ctx.globalAlpha=p.life/20; ctx.fillRect(p.x,p.y,4,4); ctx.globalAlpha=1; if(p.life<=0) particles.splice(i,1);}
 // check all balls done
 if(shooting && ballObjs.every(b=>!b.active)){
  shooting=false; ballObjs=[]; 
  // remove dead bricks
  bricks=bricks.filter(b=>b.val>0);
  if(bricks.length===0 || ballObjs.length===0){ setTimeout(nextLine,300); }
 }
}
loop();

canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; const r=canvas.getBoundingClientRect(); isAiming=true; aimStart={x:t.clientX-r.left,y:t.clientY-r.top}; shootX=aimStart.x; shootY=H-20; });
canvas.addEventListener('touchmove',e=>{ if(!isAiming) return; const t=e.touches[0]; const r=canvas.getBoundingClientRect(); aimEnd={x:t.clientX-r.left,y:t.clientY-r.top}; });
canvas.addEventListener('touchend',e=>{ if(!isAiming) return; isAiming=false; if(aimEnd && !shooting){ const ang=Math.atan2(aimEnd.y-aimStart.y, aimEnd.x-aimStart.x); if(ang<0) shoot(ang); } aimEnd=null; });
canvas.addEventListener('mousedown',e=>{ const r=canvas.getBoundingClientRect(); isAiming=true; aimStart={x:e.clientX-r.left,y:e.clientY-r.top}; });
canvas.addEventListener('mousemove',e=>{ if(!isAiming) return; const r=canvas.getBoundingClientRect(); aimEnd={x:e.clientX-r.left,y:e.clientY-r.top}; });
canvas.addEventListener('mouseup',e=>{ if(!isAiming) return; isAiming=false; const r=canvas.getBoundingClientRect(); const end={x:e.clientX-r.left,y:e.clientY-r.top}; const ang=Math.atan2(end.y-aimStart.y,end.x-aimStart.x); if(ang<0 && !shooting) shoot(ang); });

function resetGame(){ stage=1; line=1; balls=100; document.getElementById('overModal').classList.remove('show'); createLevel(); updateUI(); }
document.getElementById('watchAd').addEventListener('click',showAd);
document.getElementById('fireBtn').addEventListener('click',()=>{ if(!shooting) shoot(-Math.PI/2); });
let adTimer;
function showAd(){
 document.getElementById('adModal').classList.add('show');
 let c=5; document.getElementById('adCount').textContent=c; document.getElementById('timer').textContent=c;
 const btn=document.getElementById('claimBtn'); btn.className='claim'; btn.textContent='Wait...';
 clearInterval(adTimer);
 adTimer=setInterval(()=>{ c--; document.getElementById('adCount').textContent=c; document.getElementById('timer').textContent=c; if(c<=0){ clearInterval(adTimer); btn.className='claim ready'; btn.textContent='Claim Reward >>'; } },1000);
}
document.getElementById('claimBtn').addEventListener('click',function(){ if(!this.classList.contains('ready')) return; balls+=50; updateUI(); document.getElementById('adModal').classList.remove('show'); beep(1200,0.3,0.4); // popup
 const pop=document.createElement('div'); pop.textContent='+50 Balls!'; pop.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#00f2ff;color:#000;padding:10px 20px;border-radius:20px;font-weight:900;z-index:20'; document.getElementById('gameWrap').appendChild(pop); setTimeout(()=>pop.remove(),1200);
});
document.getElementById('soundBtn').addEventListener('click',function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇'; if(soundOn && audioCtx.state==='suspended') audioCtx.resume(); });
document.getElementById('fsBtn').addEventListener('click',()=>{ const el=document.documentElement; if(!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen(); });
document.addEventListener('click',()=>{ if(audioCtx.state==='suspended') audioCtx.resume(); },{once:true});
createLevel(); updateUI();
</script>
</body>
  </html>
