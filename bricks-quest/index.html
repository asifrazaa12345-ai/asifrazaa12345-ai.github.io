<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>V105 FINAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#020512;color:#fff;font-family:Arial;overflow:hidden}
#top{height:44px;background:#0a1630;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:11px;font-weight:bold}
#prog{width:110px;height:5px;background:#1e293b;border-radius:10px;display:inline-block;margin-left:8px}#fill{width:20%;height:100%;background:linear-gradient(90deg,#a855f7,#38bdf8)}
#fb{height:50px;background:#fff;color:#000;display:flex;justify-content:space-between;align-items:center;padding:0 10px}#fb b{background:#1877f2;color:#fff;padding:5px 12px;border-radius:6px}
#earn{background:linear-gradient(90deg,#ff8c00,#ff2d2d);text-align:center;padding:5px;font-size:11px;font-weight:bold}
#box{margin:6px;border:2.5px solid #a855f7;border-radius:14px;background:#050a20;box-shadow:0 0 20px rgba(168,85,247,0.7);overflow:hidden}canvas{display:block;width:100%;background:#040712}
#bot{position:fixed;bottom:0;left:0;right:0;height:80px;background:linear-gradient(180deg,#122050,#080e28);display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.cBtn{width:54px;height:54px;border-radius:50%;border:2px solid #a855f7;background:radial-gradient(circle,#1e1030,#0a0a1a);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 14px #a855f7;position:relative}.cBtn small{position:absolute;bottom:-6px;right:-6px;background:#a855f7;font-size:11px;padding:2px 7px;border-radius:10px}
#sl{flex:1;margin:0 18px;height:16px;background:#1e293b;border-radius:20px;border:1px solid #a855f7;position:relative}#dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 0 14px #fff,0 0 28px #a855f7}
#rec{width:92px;height:62px;border-radius:14px;border:2px solid #ff3366;background:radial-gradient(circle,#2a1020,#1a0a1a);box-shadow:0 0 16px #ff3366;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold}
</style></head><body>
<div id="top"><div>STAGE - <span id="st">10</span> L<span id="lv">1</span>/5 V105</div><div>Line <span id="ln">0</span> | <span id="sc">0</span> | $ <span id="earnT">0.00</span></div></div>
<div id="fb"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;background:#1877f2;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold">f</div><div><div style="font-size:12px;font-weight:bold">Facebook</div><div style="font-size:10px;color:#666">V105 FINAL</div></div></div><b>Use app</b></div>
<div id="earn">V105 - NO SPACE - TOUCH = RECALL | <span id="net">ONLINE</span></div>
<div id="box"><canvas id="game"></canvas></div>
<div id="bot"><div class="cBtn">⚡<small id="spd">x2</small></div><div id="sl"><div id="dot"></div></div><div id="rec" onclick="instantRecall()"><span style="font-size:26px">↓</span><span style="font-size:10px">RECALL</span></div><div class="cBtn" onclick="showAd()" style="border-color:#f59e0b">↩<small>100</small></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H;function rs(){W=canvas.width=innerWidth-14;H=canvas.height=innerHeight-190;}rs();
let balls=[],bricks=[];let ballCount=59,score=0,stage=10,levelInStage=1,line=0,earn=0;let shootX=W/2,shootY=H-18,nextX=null,aim=false,ang=-Math.PI/2;let shooting=false,toShoot=0,shot=0,tmr=0,spd=1,fast=false;
class Brick{constructor(x,y,hp,sh,co){this.x=x;this.y=y;this.w=32;this.h=32;this.hp=hp;this.sh=sh;this.co=co;this.dead=false;}
draw(){if(this.dead)return;ctx.save();ctx.shadowColor=this.co;ctx.shadowBlur=10;ctx.strokeStyle=this.co;ctx.lineWidth=1.2;let a='32';if(this.sh=='sq'){ctx.fillStyle=this.co+a;ctx.fillRect(this.x,this.y,this.w,this.h);ctx.strokeRect(this.x,this.y,this.w,this.h);}if(this.sh=='triR'){ctx.fillStyle=this.co+a;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.w,this.y+this.h/2);ctx.lineTo(this.x,this.y+this.h);ctx.closePath();ctx.fill();ctx.stroke();}if(this.sh=='triL'){ctx.fillStyle=this.co+a;ctx.beginPath();ctx.moveTo(this.x+this.w,this.y);ctx.lineTo(this.x+this.w,this.y+this.h);ctx.lineTo(this.x,this.y+this.h/2);ctx.closePath();ctx.fill();ctx.stroke();}if(this.sh=='cir'){ctx.beginPath();ctx.arc(this.x+16,this.y+16,7,0,Math.PI*2);ctx.fillStyle=this.co;ctx.shadowBlur=14;ctx.fill();ctx.restore();return;}ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(this.hp,this.x+16,this.y+20);ctx.restore();}}
class Ball{constructor(x,y,a){this.x=x;this.y=y;this.vx=Math.cos(a)*7.5;this.vy=Math.sin(a)*7.5;this.r=4.5;this.ac=true;}update(){let s=fast?7:spd;if(!this.ac)return;this.x+=this.vx*s;this.y+=this.vy*s;if(this.x<this.r||this.x>W-this.r){this.vx*=-1;this.x=Math.max(this.r,Math.min(W-this.r,this.x));}if(this.y<this.r){this.vy*=-1;this.y=this.r;}if(this.y>H-4){this.ac=false;if(nextX===null)nextX=this.x;return;}for(let b of bricks){if(b.dead)continue;if(b.sh=='cir'){let dx=this.x-(b.x+16),dy=this.y-(b.y+16);if(Math.hypot(dx,dy)<16){b.dead=true;ballCount++;}continue;}if(this.x+this.r>b.x&&this.x-this.r<b.x+b.w&&this.y+this.r>b.y&&this.y-this.r<b.y+b.h){b.hp--;if(b.hp<=0){b.dead=true;score+=10;document.getElementById('sc').innerText=score;}let ol=Math.min((this.x+this.r)-b.x,(b.x+b.w)-(this.x-this.r),(this.y+this.r)-b.y,(b.y+b.h)-(this.y-this.r));if(ol==(this.x+this.r)-b.x||ol==(b.x+b.w)-(this.x-this.r))this.vx*=-1;else this.vy*=-1;break;}}}draw(){if(!this.ac)return;ctx.save();ctx.shadowColor='#d8b4fe';ctx.shadowBlur=10;ctx.fillStyle='#f5e8ff';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
function make(){let m=2;let base=15+stage*2+levelInStage*3;let hp1=base+15,hp2=base+8,hp3=base,hp4=base-4;
bricks=[
new Brick(m,2,hp1,'sq','#a855f7'),new Brick(m+32,2,hp1,'triL','#a855f7'),new Brick(m+64,2,hp1,'sq','#a855f7'),new Brick(m+96,2,hp1,'sq','#a855f7'),new Brick(m+128,2,hp1,'sq','#a855f7'),new Brick(m+160,2,hp1,'sq','#a855f7'),new Brick(m+192,2,hp1,'sq','#a855f7'),new Brick(m+224,2,hp1,'sq','#a855f7'),
new Brick(m,34,hp2,'sq','#f97316'),new Brick(m+32,34,hp2,'sq','#f97316'),new Brick(m+64,34,hp2,'sq','#f97316'),new Brick(m+96,34,0,'cir','#f97316'),new Brick(m+128,34,hp2,'sq','#a855f7'),new Brick(m+160,34,hp2,'sq','#a855f7'),new Brick(m+192,34,hp2,'sq','#a855f7'),
new Brick(m,66,hp3,'sq','#38bdf8'),new Brick(m+32,66,hp3,'sq','#38bdf8'),new Brick(m+64,66,hp3,'sq','#38bdf8'),new Brick(m+96,66,hp3,'sq','#38bdf8'),new Brick(m+128,66,hp3,'sq','#38bdf8'),new Brick(m+160,66,hp3,'triR','#f59e0b'),new Brick(m+192,66,hp3,'sq','#38bdf8'),
new Brick(m,98,hp4,'sq','#22c55e'),new Brick(m+32,98,hp4,'sq','#22c55e'),new Brick(m+64,98,hp4,'sq','#22c55e'),new Brick(m+96,98,hp4,'sq','#22c55e'),new Brick(m+128,98,hp4,'sq','#22c55e'),
new Brick(m,130,hp4-4,'sq','#10b981'),new Brick(m+32,130,hp4-4,'sq','#10b981'),new Brick(m+64,130,hp4-4,'sq','#10b981'),new Brick(m+96,130,hp4-4,'triR','#10b981'),new Brick(m+128,130,hp4-4,'sq','#10b981'),new Brick(m+160,130,hp4-4,'sq','#10b981'),new Brick(m+192,130,hp4-4,'sq','#10b981'),
new Brick(m+64,162,0,'cir','#a855f7'),new Brick(m+96,162,hp3,'sq','#d8b4fe'),
];}
make();
function instantRecall(){if(!shooting)return;balls.forEach(b=>{b.ac=false;});if(balls.length>0)nextX=balls[0].x;shot=toShoot;}
function aimF(mx,my){let dx=mx-shootX,dy=my-shootY;if(dy>-5)dy=-5;ang=Math.atan2(dy,dx);}
canvas.addEventListener('touchstart',e=>{let r=canvas.getBoundingClientRect();let x=e.touches[0].clientX-r.left,y=e.touches[0].clientY-r.top;if(shooting){instantRecall();return;}aim=true;aimF(x,y);});
canvas.addEventListener('touchmove',e=>{if(aim){let r=canvas.getBoundingClientRect();aimF(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);}});
canvas.addEventListener('touchend',()=>{if(aim){aim=false;shooting=true;toShoot=ballCount;shot=0;tmr=0;balls=[];nextX=null;line++;document.getElementById('ln').innerText=line;}});
function showAd(){let on=navigator.onLine;let d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9999;display:flex;align-items:center;justify-content:center';d.innerHTML=`<div style="background:#0a1430;padding:20px;border-radius:16px;width:88%;text-align:center;border:2px solid #a855f7"><h3>🎁 +15 Balls V105</h3><p>Stage ${stage} Level ${levelInStage}/5</p><button id="adB" style="background:linear-gradient(90deg,#a855f7,#ff3366);border:none;padding:12px;border-radius:20px;color:white;width:100%;font-weight:bold">Wait 3s...</button></div>`;document.body.appendChild(d);let s=3;let iv=setInterval(()=>{s--;let b=document.getElementById('adB');if(b)b.innerText=`Wait ${s}s...`;if(s<=0){clearInterval(iv);b.innerText='Close & Get +15 Balls';b.onclick=()=>{d.remove();ballCount+=15;if(on){earn+=0.05;document.getElementById('earnT').innerText=earn.toFixed(2);}};}},1000);}
function loop(){ctx.clearRect(0,0,W,H);if(aim){ctx.fillStyle='rgba(216,180,254,0.95)';for(let i=0;i<35;i++){let px=shootX+Math.cos(ang)*(16+i*9),py=shootY+Math.sin(ang)*(16+i*9);ctx.beginPath();ctx.arc(px,py,1.8,0,Math.PI*2);ctx.fill();}}if(shooting){tmr++;if(tmr>=3&&shot<toShoot){balls.push(new Ball(shootX,shootY,ang));shot++;tmr=0;}if(shot>=toShoot&&balls.every(b=>!b.ac)){shooting=false;fast=false;if(nextX!==null)shootX=nextX;bricks.forEach(b=>{if(!b.dead)b.y+=32;});bricks=bricks.filter(b=>!b.dead);if(bricks.some(b=>b.y+b.h>H-18&&b.sh!='cir')){alert('Game Over');location.reload();}if(bricks.filter(b=>b.sh!='cir').length==0){levelInStage++;if(levelInStage>5){levelInStage=1;stage++;document.getElementById('st').innerText=stage;}document.getElementById('lv').innerText=levelInStage;document.getElementById('fill').style.width=(levelInStage*20)+'%';if(levelInStage==1)showAd();make();}}}bricks.forEach(b=>b.draw());balls.forEach(b=>{b.update();b.draw();});ctx.save();ctx.shadowColor='#e9d5ff';ctx.shadowBlur=12;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(shootX,shootY,6,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.fillText('x'+ballCount,shootX+10,shootY+3);requestAnimationFrame(loop);}loop();
let sd=document.createElement('div');sd.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5000;background:rgba(2,5,16,0.88);font-size:48px;font-weight:900;color:#fff;text-shadow:0 0 20px #a855f7';sd.innerHTML='START V105<br><span style="font-size:14px">FINAL</span>';document.body.appendChild(sd);setTimeout(()=>sd.remove(),900);
</script></body></html>
