<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRICKS QUEST V7.4 LIVE EARNING</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02020a;color:#fff;font-family:'Orbitron',sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{height:58px;min-height:58px;background:#0a0a1e;display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-bottom:2px solid #1e1e4a}
.logo{color:#00f2ff;font-size:11px;line-height:1.1}
.logo span{color:#00ff88;font-size:10px;display:block}
.hstats{display:flex;gap:6px;font-size:8px;color:#888}
.hstats b{color:#fff}
.earn{color:#00ff88;font-size:11px;font-weight:800;background:#002211;padding:4px 8px;border-radius:8px;border:1px solid #00ff88}
.game-wrap{flex:1;min-height:0;position:relative;background:radial-gradient(circle at 50% 10%,#1a1a60,#02020a)}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.footer{height:62px;min-height:62px;background:#0a0a1e;border-top:2px solid #1e1e4a;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.balls{font-size:12px;color:#00f2ff;font-weight:800}
.adbtn{background:linear-gradient(90deg,#00f2ff,#7000ff);border:none;padding:9px 14px;border-radius:20px;color:#fff;font-family:'Orbitron';font-size:9px;font-weight:800;cursor:pointer;box-shadow:0 0 15px #00f2ff}
.modal{position:absolute;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.modal.show{display:flex}
.card{background:linear-gradient(180deg,#1e1e50,#0a0a1e);border:2px solid #00f2ff;border-radius:20px;padding:18px;width:100%;max-width:340px;text-align:center;box-shadow:0 0 30px rgba(0,242,255,0.3)}
.claim{width:100%;padding:12px;border-radius:10px;border:none;font-family:'Orbitron';font-weight:800;margin-top:10px;cursor:pointer}
.claim.wait{background:#222;color:#555}
.claim.ready{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000}
.claim.earn{background:linear-gradient(90deg,#00f2ff,#7000ff);color:#fff}
</style>
</head>
<body>
<div class="header">
<div class="logo">BRICKS QUEST<br><span id="liveEarn">💰 $0.0000 LIVE</span></div>
<div class="hstats"><div>STAGE-<b id="stage">1</b></div><div>LINE <b id="line">1/10</b></div></div>
<div class="earn" id="earnBox">$0.00</div>
</div>
<div class="game-wrap" id="wrap"><canvas id="canvas"></canvas>

<!-- Ad Modal - Har 5 level + Game Over -->
<div class="modal" id="adModal"><div class="card">
<div id="adType" style="color:#ffeb00;font-size:10px">🎬 ADVERTISEMENT</div>
<h2 id="adTitle" style="color:#00f2ff;margin:8px 0">🎁 FREE REWARD</h2>
<div style="background:#000;border-radius:12px;padding:22px;margin:10px 0;border:1px dashed #444">
<div style="font-size:30px">📺</div>
<div id="adDesc" style="color:#aaa;font-size:10px;margin-top:6px">Watch ad to continue & earn</div>
<div style="color:#00ff88;font-size:9px;margin-top:8px">Live Earning: +$0.025 per ad view</div>
</div>
<div style="display:flex;justify-content:space-between;font-size:10px;color:#888"><span>Earning:</span><span id="adEarn" style="color:#00ff88">+$0.025</span></div>
<div id="timer" style="font-size:36px;margin:10px 0">5</div>
<button class="claim wait" id="claimBtn">Watching Ad...</button>
</div></div>

<div class="modal" id="overModal"><div class="card"><h2 style="color:#ff2a5a">Game Over!</h2><p style="color:#aaa;font-size:10px;margin:6px 0">Watch ad to get +25 balls and continue earning!</p><div style="color:#00ff88;margin:8px 0;font-size:14px">Total Earned: <span id="overEarn">$0.00</span></div><button class="claim earn" id="overAdBtn">📺 Watch Ad +25 Balls & Continue</button><button class="claim ready" onclick="resetGame()" style="background:#222;color:#888;margin-top:6px">No Thanks, Restart</button></div></div>

</div>
<div class="footer"><div class="balls">⚪ x<span id="ballCount">50</span></div><button class="adbtn" id="watchAdBtn">📺 +25 Balls</button><div style="font-size:11px;color:#00ff88" id="footerEarn">$0.000</div></div>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), wrap=document.getElementById('wrap');
let W,H,dpr, stage=1, line=1, balls=50, AD_REWARD=25, earnings=0, best=parseFloat(localStorage.getItem('bq_earn')||0);
let bricks=[], ballObjs=[], particles=[], shooting=false, isAiming=false, aimS=null, aimE=null, adMode='', pendingAction=null;
let cols=7, gap=6, bh=44;
function resize(){ W=wrap.clientWidth; H=wrap.clientHeight; dpr=window.devicePixelRatio||1; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); if(bricks.length==0) createFirst(); }
window.addEventListener('resize',resize);
function getColor(n){ if(n<=8) return ['#00ff88','#002200']; if(n<=18) return ['#ffeb00','#331a00']; if(n<=30) return ['#ff7b00','#fff']; return ['#ff00ff','#fff']; }
function createFirst(){ bricks=[]; for(let c=0;c<cols;c++){ if(Math.random()<0.6){ let val=Math.floor(3+Math.random()*6); let bw=W/cols-gap; bricks.push({x:c*(bw+gap)+gap/2,y:gap,w:bw,h:bh,val}); } } }
function addTopRowAndMoveDown(){
 let step=bh+gap; for(let b of bricks) b.y+=step;
 for(let b of bricks){ if(b.y+b.h>H-80) return true; }
 let bw=W/cols-gap; for(let c=0;c<cols;c++){ if(Math.random()<0.65){ let base=line<=2?3:line<=4?9:16; let val=Math.floor(base+Math.random()*(5+line*2)); bricks.push({x:c*(bw+gap)+gap/2,y:gap,w:bw,h:bh,val}); } }
 return false;
}
function updateUI(){
 document.getElementById('stage').textContent=stage; document.getElementById('line').textContent=line+'/10';
 document.getElementById('ballCount').textContent=balls;
 document.getElementById('liveEarn').textContent='💰 $'+earnings.toFixed(4)+' LIVE';
 document.getElementById('earnBox').textContent='$'+earnings.toFixed(3);
 document.getElementById('footerEarn').textContent='$'+earnings.toFixed(3);
}
function addEarn(v){ earnings+=v; if(earnings>best){best=earnings; localStorage.setItem('bq_earn',best);} updateUI(); }
function spawnParticles(x,y,c){ for(let i=0;i<10;i++) particles.push({x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10-2,life:25,color:c}); }
function shoot(angle){ if(shooting) return; shooting=true; ballObjs=[]; let idx=0; let sx=aimS?aimS.x:W/2; let iv=setInterval(()=>{ if(idx>=balls){clearInterval(iv);return;} ballObjs.push({x:sx,y:H-22,vx:Math.cos(angle)*14,vy:Math.sin(angle)*14,active:true}); idx++; },40); }

// AD SYSTEM
let adTimer;
function showAd(type){
 adMode=type;
 document.getElementById('adModal').classList.add('show');
 let title=document.getElementById('adTitle'), desc=document.getElementById('adDesc'), earnTxt=document.getElementById('adEarn'), typeTxt=document.getElementById('adType');
 if(type=='level'){ title.textContent='🎉 LEVEL '+stage+' REWARD!'; desc.textContent='You reached Stage '+stage+'! Watch ad to earn +25 balls & $0.025'; earnTxt.textContent='+$0.025 +25 Balls'; typeTxt.textContent='🏆 LEVEL '+stage+' BONUS AD'; }
 else if(type=='gameover'){ title.textContent='💔 GAME OVER REWARD'; desc.textContent='Watch ad to revive with +25 balls and keep earning!'; earnTxt.textContent='+$0.020 +25 Balls'; typeTxt.textContent='💀 GAME OVER AD'; }
 else { title.textContent='🎁 FREE BALLS'; desc.textContent='Watch ad to get +25 balls'; earnTxt.textContent='+$0.015 +25 Balls'; typeTxt.textContent='🎬 REWARD AD'; }
 let c=5; document.getElementById('timer').textContent=c; const btn=document.getElementById('claimBtn'); btn.className='claim wait'; btn.textContent='Watching Ad...'; clearInterval(adTimer);
 adTimer=setInterval(()=>{ c--; document.getElementById('timer').textContent=c; if(c<=0){ clearInterval(adTimer); btn.className='claim ready'; if(type=='level') btn.textContent='Claim +25 Balls + $0.025 >>'; else if(type=='gameover') btn.textContent='Claim & Continue >>'; else btn.textContent='Claim +25 Balls >>'; } },1000);
}

function loop(){
 requestAnimationFrame(loop);
 ctx.clearRect(0,0,W,H);
 for(let b of bricks){ if(b.val<=0) continue; let col=getColor(b.val); ctx.fillStyle=col[0]; ctx.shadowColor=col[0]; ctx.shadowBlur=12; ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,12); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle=col[1]; ctx.font='bold 14px Orbitron'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.val,b.x+b.w/2,b.y+b.h/2); }
 if(!shooting){ let sx=isAiming&&aimS?aimS.x:W/2; ctx.fillStyle='#fff'; ctx.shadowColor='#00f2ff'; ctx.shadowBlur=18; ctx.beginPath(); ctx.arc(sx,H-22,11,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle='rgba(0,242,255,0.4)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,H-22,18+Math.sin(Date.now()/200)*3,0,Math.PI*2); ctx.stroke(); }
 if(isAiming&&aimS&&aimE){ let ang=Math.atan2(aimE.y-aimS.y,aimE.x-aimS.x); if(ang<0){ for(let i=1;i<=16;i++){ let px=aimS.x+Math.cos(ang)*i*22, py=aimS.y+Math.sin(ang)*i*22; if(py<60) break; ctx.fillStyle=i%2==0?'#fff':'rgba(0,242,255,0.8)'; ctx.beginPath(); ctx.arc(px,py,i==16?8:5,0,Math.PI*2); ctx.fill(); } } }
 for(let b of ballObjs){ if(!b.active) continue; b.x+=b.vx; b.y+=b.vy; if(b.x<10||b.x>W-10){b.vx*=-1; b.x=Math.max(10,Math.min(W-10,b.x));} if(b.y<10){b.vy*=-1; b.y=10;} for(let br of bricks){ if(br.val<=0) continue; if(b.x>br.x-6&&b.x<br.x+br.w+6&&b.y>br.y-6&&b.y<br.y+br.h+6){ br.val--; spawnParticles(b.x,b.y,getColor(br.val+1)[0]); if(br.val<=0){ addEarn(0.001); } b.vy*=-1; break; } } if(b.y>H+30) b.active=false; if(b.active){ ctx.fillStyle='#fff'; ctx.shadowColor='#00f2ff'; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(b.x,b.y,8,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; } }
 for(let i=particles.length-1;i>=0;i--){ let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life--; ctx.fillStyle=p.color; ctx.globalAlpha=p.life/25; ctx.fillRect(p.x,p.y,4,4); ctx.globalAlpha=1; if(p.life<=0) particles.splice(i,1); }
 if(shooting && ballObjs.length>0 && ballObjs.every(b=>!b.active)){
  shooting=false; ballObjs=[]; bricks=bricks.filter(b=>b.val>0); line++; stage=Math.floor(line/2)+1;
  let isOver=addTopRowAndMoveDown();
  if(isOver){ document.getElementById('overEarn').textContent='$'+earnings.toFixed(4); document.getElementById('overModal').classList.add('show'); return; }
  // HAR 5 LEVEL PAR AD
  if(stage%5==0){ showAd('level'); } 
  updateUI();
 }
}
function getPos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
canvas.addEventListener('touchstart',e=>{ isAiming=true; aimS=getPos(e); e.preventDefault(); },{passive:false});
canvas.addEventListener('touchmove',e=>{ if(!isAiming) return; aimE=getPos(e); e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend',e=>{ if(!isAiming) return; isAiming=false; if(aimE&&aimS){ let ang=Math.atan2(aimE.y-aimS.y,aimE.x-aimS.x); if(ang<0) shoot(ang); } });
canvas.addEventListener('mousedown',e=>{ isAiming=true; aimS=getPos(e); });
canvas.addEventListener('mousemove',e=>{ if(isAiming) aimE=getPos(e); });
canvas.addEventListener('mouseup',e=>{ if(!isAiming) return; isAiming=false; let p=getPos(e); let ang=Math.atan2(p.y-aimS.y,p.x-aimS.x); if(ang<0) shoot(ang); });

// Claim buttons
document.getElementById('claimBtn').addEventListener('click',function(){
 if(!this.classList.contains('ready')) return;
 if(adMode=='level'){ balls+=25; addEarn(0.025); }
 else if(adMode=='gameover'){ balls+=25; addEarn(0.02); document.getElementById('overModal').classList.remove('show'); }
 else { balls+=25; addEarn(0.015); }
 document.getElementById('adModal').classList.remove('show'); updateUI();
});
document.getElementById('watchAdBtn').addEventListener('click',()=>showAd('normal'));
document.getElementById('overAdBtn').addEventListener('click',()=>{ document.getElementById('overModal').classList.remove('show'); showAd('gameover'); });
function resetGame(){ stage=1; line=1; balls=50; earnings=0; bricks=[]; document.getElementById('overModal').classList.remove('show'); document.getElementById('adModal').classList.remove('show'); createFirst(); updateUI(); }
resize(); updateUI(); loop();
</script>
</body>
 </html>
