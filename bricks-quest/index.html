<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bricks Breaker Quest - FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center}
.top{width:100%;max-width:480px;background:#0d1025;display:flex;justify-content:space-between;padding:10px;font-weight:bold;border-bottom:2px solid #6a4aff}
#adTop{width:100%;max-width:480px;height:55px;background:#1a1a3a;border:2px solid #ffd700;display:flex;align-items:center;justify-content:center;color:#ffd700;font-size:13px;cursor:pointer}
#gameArea{width:100%;max-width:480px;height:68vh;position:relative;background:radial-gradient(circle at top,#1a1040,#050510);border-left:2px solid #6a4aff;border-right:2px solid #6a4aff}
canvas{width:100%;height:100%;display:block;touch-action:none}
#adBottom{width:100%;max-width:480px;height:50px;background:#000;border:2px solid #ff00ff;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffcc00;cursor:pointer;font-size:13px}
.bottomBar{width:100%;max-width:480px;background:#1a0f35;display:flex;justify-content:space-around;padding:8px;align-items:center}
.btn{width:45px;height:45px;border-radius:50%;background:#251a4a;border:2px solid #6a4aff;display:flex;align-items:center;justify-content:center;font-size:18px}
#adModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
</style>
</head>
<body>
<div class="top"><span>BRICKS BREAKER QUEST</span><span id="info">STAGE-10 | Score:0</span></div>
<div id="adTop" onclick="showAd(1)">🔥 AD 1 - Click Here - Earning Banner Ad 🔥</div>
<div id="gameArea"><canvas id="c" width="480" height="680"></canvas></div>
<div id="adBottom" onclick="showAd(2)"><span>▶ Watch Ad +50 balls! (AD 2 - Rewarded)</span><span style="background:#ff00ff;color:#fff;padding:5px 12px;border-radius:20px" id="ballTxt">x63</span></div>
<div class="bottomBar"><div class="btn">⚡x3</div><div style="width:180px;height:14px;background:#2a1450;border-radius:10px"><div id="progress" style="width:60%;height:100%;background:linear-gradient(90deg,#ff00ff,#00ffff);border-radius:10px"></div></div><div class="btn">❤️x3</div></div>

<div id="adModal"><h2 style="color:#ffd700;margin-bottom:15px">📢 Advertisement Playing...</h2><div style="width:300px;height:200px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold">Your Ad Here<br>Earning $0.05 per view</div><p style="margin:15px;color:#aaa" id="adTimer">Ad ends in 5s...</p><button onclick="closeAd()" style="padding:10px 30px;background:#6a4aff;color:#fff;border:none;border-radius:10px;font-size:16px">Close Ad & Get Reward</button></div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let bricks=[],balls=[],aiming=false,aimX=240,aimY=300,ballCount=63,stage=10,score=0,line=0,adReward=0;
let audioCtx; function playSound(f){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.value=0.18;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);o.stop(audioCtx.currentTime+0.15);}catch(e){}}

function createLevel(){
bricks=[]; let colors=['#ffaa44','#00ffff','#ff8866','#88ffaa','#aaaaff','#ff66ff'];
for(let r=0;r<6;r++){let y=60+r*58;for(let i=0;i<6;i++){let x=10+i*76;let num=12+Math.floor(Math.random()*10)+stage;let tri=Math.random()>0.65?['tr','br','tl','bl'][Math.floor(Math.random()*4)]:null;let circ=Math.random()>0.8;bricks.push({x,y,w:58,h:30,num:num,color:colors[r%6],tri:tri,circ:circ,alive:true,alpha:0.9});}}
document.getElementById('info').innerText=`STAGE-${stage} | Score:${score} | Line:${line}`;
}
function drawBrick(b){
if(!b.alive)return; ctx.globalAlpha=b.alpha; ctx.strokeStyle=b.color; ctx.lineWidth=3; ctx.shadowColor=b.color; ctx.shadowBlur=15; ctx.fillStyle=b.color+'33';
if(b.circ){ctx.beginPath();ctx.arc(b.x+20,b.y+15,18,0,Math.PI*2);ctx.fill();ctx.stroke();}
else if(b.tri){ctx.beginPath();if(b.tri==='tr'){ctx.moveTo(b.x,b.y+30);ctx.lineTo(b.x+40,b.y);ctx.lineTo(b.x+40,b.y+30);}else if(b.tri==='br'){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+40,b.y);ctx.lineTo(b.x+40,b.y+30);}else if(b.tri==='tl'){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+58,b.y);ctx.lineTo(b.x,b.y+30);}else{ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+30);ctx.lineTo(b.x+58,b.y+30);}ctx.closePath();ctx.fill();ctx.stroke();}
else{ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeRect(b.x,b.y,b.w,b.h);}
ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(b.num,b.x+b.w/2,b.y+19);
}
function moveDown(){
bricks.forEach(b=>b.y+=58); line++; if(bricks.some(b=>b.y>590)){alert('GAME OVER! Bricks neeche pahuch gayi! Score:'+score); score=0; stage=10; line=0; createLevel(); return;}
if(bricks.every(b=>!b.alive)){stage++; line=0; showAd(3); createLevel();}
document.getElementById('info').innerText=`STAGE-${stage} | Score:${score} | Line:${line}`;
}
function shoot(){
if(balls.length>0)return; playSound(350); let dx=aimX-240,dy=aimY-620,len=Math.sqrt(dx*dx+dy*dy);dx=dx/len*9;dy=dy/len*9;
for(let i=0;i<ballCount;i++){setTimeout(()=>{balls.push({x:240,y:615,vx:dx+(Math.random()-0.5)*0.6,vy:dy})},i*25);}
}
canvas.addEventListener('pointerdown',e=>{aiming=true; let r=canvas.getBoundingClientRect(); aimX=(e.clientX-r.left)/r.width*480; aimY=(e.clientY-r.top)/r.height*680;});
canvas.addEventListener('pointermove',e=>{if(!aiming)return; let r=canvas.getBoundingClientRect(); aimX=(e.clientX-r.left)/r.width*480; aimY=(e.clientY-r.top)/r.height*680;});
canvas.addEventListener('pointerup',()=>{if(aiming){aiming=false; shoot();}});
function loop(){
ctx.clearRect(0,0,480,680);
// WHITE DOT + DOTTED LINE FIX
if(aiming && balls.length===0){
ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.setLineDash([8,8]); ctx.beginPath(); ctx.moveTo(240,615); ctx.lineTo(aimX,aimY); ctx.stroke(); ctx.setLineDash([]);
// WHITE DOTS - Ab clear nazar ayenge
for(let i=1;i<=12;i++){
let px=240+(aimX-240)*i/13, py=615+(aimY-615)*i/13;
ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2); ctx.fillStyle=i%2==0?'#ffffff':'#ffffff88'; ctx.fill();
ctx.shadowColor='#fff'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
}
// Aim circle
ctx.beginPath(); ctx.arc(aimX,aimY,18,0,Math.PI*2); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
ctx.beginPath(); ctx.arc(aimX,aimY,4,0,Math.PI*2); ctx.fillStyle='#ff00ff'; ctx.fill();
}
bricks.forEach(drawBrick);
for(let i=balls.length-1;i>=0;i--){
let b=balls[i]; b.x+=b.vx; b.y+=b.vy;
if(b.x<8||b.x>472) b.vx*=-1; if(b.y<8) b.vy*=-1; if(b.y>670){balls.splice(i,1); continue;}
bricks.forEach(br=>{
if(!br.alive)return;
if(b.x>br.x && b.x<br.x+br.w && b.y>br.y && b.y<br.y+br.h){
br.num--; playSound(900); score+=10; // SCORE FIX
document.getElementById('info').innerText=`STAGE-${stage} | Score:${score} | Line:${line}`;
b.vy*=-1; br.alpha=0.4+br.num/50;
if(br.num<=0){br.alive=false; score+=20; document.getElementById('info').innerText=`STAGE-${stage} | Score:${score} | Line:${line}`;}
}
});
ctx.beginPath(); ctx.arc(b.x,b.y,7,0,Math.PI*2); ctx.fillStyle='#ff88ff'; ctx.shadowColor='#ff00ff'; ctx.shadowBlur=15; ctx.fill(); ctx.shadowBlur=0;
}
if(balls.length===0 && !aiming){
if(!window.lastT) window.lastT=Date.now();
if(Date.now()-window.lastT>800 && bricks.some(b=>b.alive)){moveDown(); window.lastT=Date.now();}
} else window.lastT=Date.now();
requestAnimationFrame(loop);
}
function showAd(type){
adReward=type; document.getElementById('adModal').style.display='flex';
let t=5; let tm=document.getElementById('adTimer');
let inter=setInterval(()=>{t--; tm.innerText=`Ad ends in ${t}s... Earning $${(type*0.02).toFixed(2)}`; if(t<=0){clearInterval(inter); tm.innerText='Reward Ready! Click Close';}},1000);
}
function closeAd(){
document.getElementById('adModal').style.display='none';
if(adReward==2){ballCount+=50; document.getElementById('ballTxt').innerText='x'+ballCount; alert('✅ Ad Watched! +50 Balls! Total x'+ballCount+' - Earning $0.05');}
else if(adReward==1){score+=50; document.getElementById('info').innerText=`STAGE-${stage} | Score:${score} | Line:${line}`; alert('✅ Banner Ad Clicked! +50 Score - Earning $0.02');}
else if(adReward==3){score+=100; alert('✅ Level Complete Ad! +100 Score - Earning $0.10 - Next Stage '+stage);}
}
createLevel(); loop();
</script>
</body>
</html>
