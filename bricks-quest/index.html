<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bricks Quest</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8616771506977449" crossorigin="anonymous"></script>
<style>
body{margin:0;padding:0;background:#0f0f1e;color:white;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center}
h1{color:#ffcc00;margin:4px 0;border:1px dashed #444;padding:6px 12px;border-radius:8px}
#gameBox{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border-radius:10px;margin:6px 0;padding:10px}
canvas{background:#1a1a2e;border-radius:10px;margin:6px 0;touch-action:none;box-shadow:0 0 15px rgba(0,0,0,0.5)}
button{background:#ffcc00;color:#1a1a2e;border-radius:10px;margin:6px 0;font-weight:bold;padding:10px 20px;border:none;cursor:pointer;font-size:16px}
button:hover{background:#ffdb4d}
#score{font-size:18px;margin:5px}
</style>
</head>
<body>
<h1>Bricks Quest</h1>
<div id="score">Score: 0</div>
<div id="gameBox">
<canvas id="game" width="480" height="320"></canvas>
</div>
<button onclick="startGame()">Start Game</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let x,y,dx,dy,score=0;
let paddleW=75,paddleX,paddleH=10;
let right=false,left=false;
let bricks=[], brickRow=3, brickCol=5, brickW=75, brickH=20, brickPad=10, brickTop=30, brickLeft=30;

function initBricks(){
 bricks=[];
 for(let c=0;c<brickCol;c++){
  bricks[c]=[];
  for(let r=0;r<brickRow;r++){
   bricks[c][r]={x:0,y:0,status:1};
  }
 }
}
function init(){
 x=canvas.width/2; y=canvas.height-30; dx=2; dy=-2;
 paddleX=(canvas.width-paddleW)/2;
 score=0; initBricks();
 document.getElementById("score").innerText="Score: "+score;
}
function drawBall(){
 ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fillStyle="#ffcc00"; ctx.fill(); ctx.closePath();
}
function drawPaddle(){
 ctx.beginPath(); ctx.rect(paddleX,canvas.height-paddleH, paddleW, paddleH); ctx.fillStyle="#00ccff"; ctx.fill(); ctx.closePath();
}
function drawBricks(){
 for(let c=0;c<brickCol;c++){
  for(let r=0;r<brickRow;r++){
   if(bricks[c][r].status==1){
    let bx=(c*(brickW+brickPad))+brickLeft;
    let by=(r*(brickH+brickPad))+brickTop;
    bricks[c][r].x=bx; bricks[c][r].y=by;
    ctx.beginPath(); ctx.rect(bx,by,brickW,brickH); ctx.fillStyle="#ff3366"; ctx.fill(); ctx.closePath();
   }
  }
 }
}
function collision(){
 for(let c=0;c<brickCol;c++){
  for(let r=0;r<brickRow;r++){
   let b=bricks[c][r];
   if(b.status==1){
    if(x>b.x && x<b.x+brickW && y>b.y && y<b.y+brickH){
     dy=-dy; b.status=0; score++; document.getElementById("score").innerText="Score: "+score;
     if(score==brickRow*brickCol){alert("You Win!"); init();}
    }
   }
  }
 }
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 drawBricks(); drawBall(); drawPaddle(); collision();
 if(x+dx>canvas.width-10 || x+dx<10) dx=-dx;
 if(y+dy<10) dy=-dy;
 else if(y+dy>canvas.height-15){
  if(x>paddleX && x<paddleX+paddleW) dy=-dy;
  else {alert("Game Over"); init(); return;}
 }
 if(right && paddleX<canvas.width-paddleW) paddleX+=5;
 if(left && paddleX>0) paddleX-=5;
 x+=dx; y+=dy;
 requestAnimationFrame(draw);
}
document.addEventListener("keydown",e=>{if(e.key=="Right"||e.key=="ArrowRight")right=true; if(e.key=="Left"||e.key=="ArrowLeft")left=true;});
document.addEventListener("keyup",e=>{if(e.key=="Right"||e.key=="ArrowRight")right=false; if(e.key=="Left"||e.key=="ArrowLeft")left=false;});
function startGame(){init(); draw();}
init();
</script>
</body>
 </html>
