<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>BRICKS QUEST V100 NEON</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#020512;color:#fff;font-family:Arial;overflow:hidden}
#top{height:44px;background:#0a1630;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:11px;font-weight:bold}
#prog{width:110px;height:5px;background:#1e293b;border-radius:10px;display:inline-block;margin-left:8px}#fill{width:72%;height:100%;background:linear-gradient(90deg,#a855f7,#38bdf8);border-radius:10px}
#fb{height:50px;background:#fff;color:#000;display:flex;justify-content:space-between;align-items:center;padding:0 10px}#fb b{background:#1877f2;color:#fff;padding:5px 12px;border-radius:6px;font-size:12px}
#earn{background:linear-gradient(90deg,#ff8c00,#ff2d2d);text-align:center;padding:5px;font-size:11px;font-weight:bold}
#box{margin:6px;border:2.5px solid #a855f7;border-radius:14px;background:#050a20;box-shadow:0 0 20px rgba(168,85,247,0.7),inset 0 0 20px rgba(168,85,247,0.2);overflow:hidden}canvas{display:block;width:100%;background:#040712}
#bot{position:fixed;bottom:0;left:0;right:0;height:80px;background:linear-gradient(180deg,#122050,#080e28);display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-top:1px solid #a855f744}
.cBtn{width:54px;height:54px;border-radius:50%;border:2px solid #a855f7;background:radial-gradient(circle,#1e1030,#0a0a1a);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 14px #a855f7;position:relative}.cBtn small{position:absolute;bottom:-6px;right:-6px;background:#a855f7;font-size:11px;padding:2px 7px;border-radius:10px}
#sl{flex:1;margin:0 18px;height:16px;background:#1e293b;border-radius:20px;border:1px solid #a855f7;position:relative}#dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 0 14px #fff,0 0 28px #a855f7}
#rec{width:92px;height:62px;border-radius:14px;border:2px solid #ff3366;background:radial-gradient(circle,#2a1020,#1a0a1a);box-shadow:0 0 16px #ff3366;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold}
</style></head><body>
<div id="top"><div>STAGE - <span id="st">10</span><div id="prog"><div id="fill"></div></div> V100</div><div>Line <span id="ln">0</span> | <span id="sc">0</span> | 💰$<span id="earnT">0.00</span></div></div>
<div id="fb"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;background:#1877f2;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold">f</div><div><div style="font-size:12px;font-weight:bold">Facebook</div><div style="font-size:10px;color:#666">FREE - V100 NEON</div></div></div><b>Use app</b></div>
<div id="earn">V100 NEON - CLAIM +15 Balls $0.05 | <span id="net">ONLINE</span></div>
<div id="box"><canvas id="game"></canvas></div>
<div id="bot"><div class="cBtn" onclick="speedBoost()">⚡<small id="spd">x2</small></div><div id="sl"><div id="dot"></div></div><div id="rec" onclick="doRecall()"><span style="font-size:26px">↓</span><span style="font-size:10px">RECALL</span></div><div class="cBtn" onclick="showAd()" style="border-color:#f59e0b">↩<small>100</small></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H;function rs(){W=canvas.width=innerWidth-14;H=canvas.height=innerHeight-190;}rs();
let balls=[],bricks=[],parts=[],floats=[];let ballCount=59,score=0,stage=10,line=0,earn=0;let shootX=W/2,shootY=H-18,nextX=null,aim=false,ang=-Math.PI/2;let shooting=false,toShoot=0,shot=0,tmr=0,spd=1,fast=false;
setInterval(()=>{document.getElementById('net').innerText=navigator.onLine?'ONLINE':'OFFLINE';},1000);
class Brick{constructor(x,y,hp,sh,co){this.x=x;this.y=y;this.w=46;this.h=46;this.hp=hp;this.sh=sh;this.co=co;this.dead=false;}draw(){if(this.dead)return;ctx.save();ctx.shadowColor=this.co;ctx.shadowBlur=18;ctx.strokeStyle=this.co;ctx.lineWidth=2.2;let a='26';if(this.sh=='sq'){ctx.fillStyle=this.co+a;ctx.fillRect(this.x,this.y,this.w,this.h);ctx.strokeRect(this.x,this.y,this.w,this.h);}if(this.sh=='triR'){ctx.fillStyle=this.co+a;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.w,this.y+this.h/2);ctx.lineTo(this.x,this.y+this.h);ctx.closePath();ctx.fill();ctx.stroke();}if(this.sh=='triL'){ctx.fillStyle=this.co+a;ctx.beginPath();ctx.moveTo(this.x+this.w,this.y);ctx.lineTo(this.x+this.w,this.y+this.h);ctx.lineTo(this.x,this.y+this.h/2);ctx.closePath();ctx.fill();ctx.stroke();}if(this.sh=='cir'){ctx.beginPath();ctx.arc(this.x+23,this.y+23,11,0,Math.PI*2);ctx.fillStyle=this.co;ctx.shadowBlur=22;ctx.fill();ctx.restore();return;}ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(this.hp,this.x+23,this.y+29);ctx.restore();}}
class Ball{constructor(x,y,a){this.x=x;this.y=y;this.vx=Math.cos(a)*7.5;this.vy=Math.sin(a)*7.5;this.r=5.5;this.ac=true;}update(){let s=fast?6:spd;if(!this.ac)return;this.x+=this.vx*s;this.y+=this.vy*s;if(this.x<this.r||this.x>W-this.r){this.vx*=-1;this.x=Math.max(this.r,Math.min(W-this.r,this.x));}if(this.y<this.r){this.vy*=-1;this.y=this.r;}if(this.y>H-4){this.ac=false;if(nextX===null)nextX=this.x;return;}for(let b of bricks){if(b.dead)continue;if(b.sh=='cir'){let dx=this.x-(b.x+23),dy=this.y-(b.y+23);if(Math.hypot(dx,dy)<19){b.dead=true;ballCount++;floats.push({x:b.x,y:b.y,t:'+1',life:30});}continue;}if(this.x+this.r>b.x&&this.x-this.r<b.x+b.w&&this.y+this.r>b.y&&this.y-this.r<b.y+b.h){b.hp--;if(b.hp<=0){b.dead=true;score+=10;document.getElementById('sc').innerText=score;floats.push({x:b.x+8,y:b.y,t:'+10',life:30});for(let i=0;i<7;i++)parts.push({x:b.x+23,y:b.y+23,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:22,c:b.co});}let ol=Math.min((this.x+this.r)-b.x,(b.x+b.w)-(this.x-this.r),(this.y+this.r)-b.y,(b.y+b.h)-(this.y-this.r));if(ol==(this.x+this.r)-b.x||ol==(b.x+b.w)-(this.x-this.r))this.vx*=-1;else this.vy*=-1;break;}}}draw(){if(!this.ac)return;ctx.save();ctx.shadowColor='#d8b4fe';ctx.shadowBlur=16;ctx.fillStyle='#f5e8ff';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore();}}
function make(){let m=8;bricks=[new Brick(m,12,35,'sq','#a855f7'),new Brick(m+56,12,35,'triL','#a855f7'),new Brick(m+112,12,35,'sq','#a855f7'),new Brick(m+224,12,35,'sq','#a855f7'),new Brick(W-52,12,35,'sq','#a855f7'),new Brick(m+22,68,0,'cir','#f97316'),new Brick(m+78,68,34,'sq','#f97316'),new Brick(m+134,68,34,'sq','#f97316'),new Brick(m+212,68,0,'cir','#f97316'),new Brick(W-52,68,34,'sq','#a855f7'),new Brick(m,124,30,'sq','#38bdf8'),new Brick(m+56,124,30,'sq','#38bdf8'),new Brick(m+112,124,30,'sq','#38bdf8'),new Brick(m+168,124,30,'sq','#38bdf8'),new Brick(m+224,124,30,'sq','#38bdf8'),new Brick(W-68,124,33,'triR','#f59e0b'),new Brick(m,180,33,'sq','#22c55e'),new Brick(m+112,180,33,'sq','#22c55e'),new Brick(W-64,180,33,'sq','#22c55e'),new Brick(m,236,26,'sq','#10b981'),new Brick(m+56,236,26,'sq','#10b981'),new Brick(m+112,236,26,'sq','#10b981'),new Brick(m+144,236,26,'triR','#10b981'),new Brick(m+202,236,26,'sq','#10b981'),new Brick(m+258,236,26,'sq','#10b981'),new Brick(W-60,236,26,'sq','#10b981'),new Brick(m+112,292,0,'cir','#a855f7'),new Brick(m+168,292,32,'sq','#d8b4fe')];}make();
function aimF(mx,my){let dx=mx-shootX,dy=my-shootY;if(dy>-5)dy=-5;ang=Math.atan2(dy,dx);}
canvas.addEventListener('touchstart',e=>{let r=canvas.getBoundingClientRect();let x=e.touches[0].clientX-r.left,y=e.touches[0].clientY-r.top;if(shooting){fast=true;return;}aim=true;aimF(x,y);});
canvas.addEventListener('touchmove',e=>{if(aim){let r=canvas.getBoundingClientRect();aimF(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);}});
canvas.addEventListener('touchend',()=>{if(aim){aim=false;shooting=true;toShoot=ballCount;shot=0;tmr=0;balls=[];nextX=null;line++;document.getElementById('ln').innerText=line;}});
function doRecall(){if(!shooting)return;fast=true;}function speedBoost(){spd=spd==1?3:1;document.getElementById('spd').innerText=spd==1?'x2':'x3';}
function showAd(){let on=navigator.onLine;let d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:9999;display:flex;align-items:center;justify-content:center';d.innerHTML=`<div style="background:#0a1430;padding:20px;border-radius:16px;width:88%;text-align:center;border:2px solid #a855f7"><h3>🎁 +15 Balls V100</h3><p style="font-size:11px;color:#aaa">Earning $${on?'0.05':'0.00'} | Total $${earn.toFixed(2)}</p><div style="background:#000;padding:12px;border-radius:8px;margin:12px 0;font-size:10px;color:#555">ca-pub-XXXXXXXX</div><button id="adB" style="background:linear-gradient(90deg,#a855f7,#ff3366);border:none;padding:12px;border-radius:20px;color:white;width:100%;font-weight:bold">Wait 3s...</button></div>`;document.body.appendChild(d);let s=3;let iv=setInterval(()=>{s--;let b=document.getElementById('adB');if(b)b.innerText=`Wait ${s}s...`;if(s<=0){clearInterval(iv);b.innerText='Close & Get +15 Balls';b.style.background='linear-gradient(90deg,#ff8c00,#ff2d2d)';b.onclick=()=>{d.remove();ballCount+=15;if(on){earn+=0.05;document.getElementById('earnT').innerText=earn.toFixed(2);}};}},1000);}
function loop(){ctx.clearRect(0,0,W,H);if(aim){ctx.fillStyle='rgba(216,180,254,0.95)';for(let i=0;i<28;i++){let px=shootX+Math.cos(ang)*(20+i*14),py=shootY+Math.sin(ang)*(20+i*14);ctx.beginPath();ctx.arc(px,py,2.8,0,Math.PI*2);ctx.fill();}}if(shooting){tmr++;if(tmr>=5&&shot<toShoot){balls.push(new Ball(shootX,shootY,ang));shot++;tmr=0;}if(shot>=toShoot&&balls.every(b=>!b.ac)){shooting=false;fast=false;if(nextX!==null)shootX=nextX;bricks.forEach(b=>{if(!b.dead)b.y+=50;});bricks=bricks.filter(b=>!b.dead);if(bricks.some(b=>b.y+b.h>H-18&&b.sh!='cir')){alert('Game Over');location.reload();}if(bricks.filter(b=>b.sh!='cir').length==0){stage++;document.getElementById('st').innerText=stage;if(stage%3==0)showAd();make();}}}bricks.forEach(b=>b.draw());parts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.life--;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);if(p.life<=0)parts.splice(i,1);});floats.forEach((f,i)=>{f.y-=1.3;f.life--;ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.fillText(f.t,f.x,f.y);if(f.life<=0)floats.splice(i,1);});balls.forEach(b=>{b.update();b.draw();});if(fast&&shooting){ctx.save();ctx.shadowColor='#a855f7';ctx.shadowBlur=28;ctx.fillStyle='rgba(168,85,247,0.95)';ctx.beginPath();ctx.moveTo(W/2-40,H/2-50);ctx.lineTo(W/2+50,H/2);ctx.lineTo(W/2-40,H/2+50);ctx.closePath();ctx.fill();ctx.restore();}ctx.save();ctx.shadowColor='#e9d5ff';ctx.shadowBlur=16;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(shootX,shootY,8,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.fillText('x'+ballCount,shootX+14,shootY+4);requestAnimationFrame(loop);}loop();
let sd=document.createElement('div');sd.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5000;background:rgba(2,5,16,0.88);font-size:64px;font-weight:900;letter-spacing:12px;color:#fff;text-shadow:0 0 20px #a855f7,0 0 60px #a855f7';sd.innerHTML='START V100';document.body.appendChild(sd);setTimeout(()=>sd.remove(),900);
</script></body></html>
