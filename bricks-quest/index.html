<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BRICKS BREAKER QUEST</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0a1628;color:white;font-family:Arial;overflow:hidden}
#topBar{display:flex;justify-content:space-between;padding:8px 12px;background:#111f3a;font-size:11px;font-weight:bold}
#bonusBar{background:linear-gradient(90deg,#ff8c00,#ff2d2d);text-align:center;padding:7px;font-size:13px;font-weight:bold;cursor:pointer}
canvas{display:block;background:#0a1628}
#controls{position:fixed;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;gap:6px}
.btn{padding:10px 14px;border-radius:20px;border:none;font-weight:bold;color:white;cursor:pointer;font-size:11px}
#speedBtn{background:#1e90ff}
#soundBtn{background:#333}
#recallBtn{background:white;color:black;flex:1;max-width:120px}
#status{position:fixed;top:36px;right:8px;font-size:9px;background:#0008;padding:3px 6px;border-radius:8px}
</style>
</head>
<body>
<div id="topBar">
  <span>BRICKS QUEST</span>
  <span id="info">STAGE:1 | Score:0 | Balls:x35</span>
</div>
<div id="bonusBar" onclick="showAd()">🎁 CLAIM BONUS +15 Balls - Tap Ad!</div>
<div id="status">● ONLINE</div>
<canvas id="game"></canvas>
<div id="controls">
  <button class="btn" id="speedBtn" onclick="toggleSpeed()">SPEED x1</button>
  <button class="btn" id="soundBtn" onclick="toggleSound()">🔊 ON</button>
  <button class="btn" id="recallBtn" onclick="recallBalls()">⚡ RECALL</button>
</div>

<script>
// --- OFFLINE / ONLINE ---
function updateOnline(){ document.getElementById('status').innerText = navigator.onLine? '● ONLINE - AdSense Active' : '● OFFLINE - Local Ad'; document.getElementById('status').style.color = navigator.onLine? '#0f0' : '#ff0'; }
window.addEventListener('online',updateOnline); window.addEventListener('offline',updateOnline); updateOnline();

// --- SOUND SYSTEM - OFFLINE WORKS ---
let soundOn=true; let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!soundOn) return; initAudio(); if(audioCtx.state=='suspended') audioCtx.resume();
  let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
  if(type=='shoot'){ o.frequency.value=300; g.gain.value=0.12; o.type='square'; }
  if(type=='hit'){ o.frequency.value=650; g.gain.value=0.09; }
  if(type=='blast'){ o.frequency.value=200; g.gain.value=0.15; o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.2); }
  if(type=='bonus'){ o.frequency.value=900; g.gain.value=0.12; o.frequency.linearRampToValueAtTime(1400,audioCtx.currentTime+0.15); }
  if(type=='collect'){ o.frequency.value=1200; g.gain.value=0.08; }
  o.start(); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2); o.stop(audioCtx.currentTime+0.22);
}
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').innerText=soundOn?'🔊 ON':'🔇 OFF'; if(soundOn){initAudio(); playSound('bonus');} }

const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let W,H; function resize(){W=canvas.width=innerWidth; H=canvas.height=innerHeight-90;} resize(); addEventListener('resize',resize);

let balls=[], bricks=[], particles=[], floatTexts=[];
let ballCount=35, score=0, stage=1;
let shootX=W/2, shootY=H-90, nextX=null, aiming=false, aimAngle=-Math.PI/2;
let shooting=false, toShoot=0, shot=0, shootTimer=0, speedMult=1, shake=0;

class Particle{ constructor(x,y,c){ this.x=x; this.y=y; this.vx=(Math.random()-0.5)*6; this.vy=(Math.random()-0.5)*6; this.c=c; this.life=18; } draw(){ ctx.globalAlpha=this.life/18; ctx.fillStyle=this.c; ctx.fillRect(this.x,this.y,3,3); ctx.globalAlpha=1; } }
class Brick{
  constructor(x,y,hp,isBonus=false){ this.x=x; this.y=y; this.w=38; this.h=38; this.hp=hp; this.max=hp; this.isBonus=isBonus; this.dead=false; }
  draw(){
    ctx.save();
    if(this.isBonus){ ctx.fillStyle='rgba(0,255,136,0.35)'; ctx.strokeStyle='#00ff88'; ctx.lineWidth=1.8; ctx.fillRect(this.x,this.y,this.w,this.h); ctx.strokeRect(this.x,this.y,this.w,this.h); ctx.fillStyle='white'; ctx.font='bold 11px Arial'; ctx.textAlign='center'; ctx.fillText('+1',this.x+19,this.y+24); ctx.restore(); return; }
    let p=this.hp/this.max; let color=p>0.6?'rgba(30,144,255,0.38)':p>0.3?'rgba(255,170,0,0.38)':'rgba(255,45,45,0.42)';
    ctx.fillStyle=color; ctx.fillRect(this.x,this.y,this.w,this.h); ctx.strokeStyle=p>0.6?'#1e90ff':p>0.3?'#ffaa00':'#ff2d2d'; ctx.lineWidth=1.5; ctx.strokeRect(this.x,this.y,this.w,this.h);
    ctx.fillStyle='white'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.fillText(this.hp,this.x+19,this.y+25); ctx.restore();
  }
}
class Ball{
  constructor(x,y,a){ this.x=x; this.y=y; this.vx=Math.cos(a)*7; this.vy=Math.sin(a)*7; this.r=4; this.active=true; }
  update(){
    if(!this.active) return;
    this.x+=this.vx*speedMult; this.y+=this.vy*speedMult;
    if(this.x-this.r<0 || this.x+this.r>W){ this.vx*=-1; this.x=Math.max(this.r,Math.min(W-this.r,this.x)); playSound('hit'); }
    if(this.y-this.r<0){ this.vy*=-1; this.y=this.r; playSound('hit'); }
    if(this.y+this.r>H-85){ this.active=false; if(nextX===null) nextX=this.x; shake=3; playSound('collect'); return; }
    for(let b of bricks){
      if(b.dead) continue;
      if(this.x+this.r>b.x && this.x-this.r<b.x+b.w && this.y+this.r>b.y && this.y-this.r<b.y+b.h){
        if(b.isBonus){ b.dead=true; ballCount++; floatTexts.push({x:b.x+19,y:b.y,txt:'+1',life:30}); playSound('bonus'); for(let i=0;i<8;i++) particles.push(new Particle(b.x+19,b.y+19,'#00ff88')); }
        else{ b.hp--; playSound(b.hp<=0?'blast':'hit'); for(let i=0;i<5;i++) particles.push(new Particle(this.x,this.y,b.hp>0?'#1e90ff':'#ff2d2d')); if(b.hp<=0){ b.dead=true; score+=10; shake=6; floatTexts.push({x:b.x+19,y:b.y,txt:'+10',life:30}); } let ol=Math.min((this.x+this.r)-b.x,(b.x+b.w)-(this.x-this.r),(this.y+this.r)-b.y,(b.y+b.h)-(this.y-this.r)); if(ol==(this.x+this.r)-b.x||ol==(b.x+b.w)-(this.x-this.r)) this.vx*=-1; else this.vy*=-1; }
        break;
      }
    }
  }
  draw(){ if(!this.active) return; ctx.beginPath(); ctx.fillStyle='white'; ctx.shadowColor='white'; ctx.shadowBlur=6; ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
}

function createStage(){ bricks=[]; let cols=6; let gap=(W-8)/cols; for(let r=0;r<4;r++){ let bonusCol=Math.floor(Math.random()*cols); for(let c=0;c<cols;c++){ if(c==bonusCol&&r==1) bricks.push(new Brick(4+c*gap,65+r*44,1,true)); else if(Math.random()>0.12){ let hp=stage*2+Math.floor(Math.random()*6)+4; bricks.push(new Brick(4+c*gap,65+r*44,hp,false)); } } } }
createStage();

function updateAim(mx,my){ let dx=mx-shootX, dy=my-shootY; if(dy>-15) dy=-15; aimAngle=Math.atan2(dy,dx); }
canvas.addEventListener('touchstart',e=>{ initAudio(); if(shooting) return; aiming=true; updateAim(e.touches[0].clientX,e.touches[0].clientY); });
canvas.addEventListener('touchmove',e=>{ if(aiming) updateAim(e.touches[0].clientX,e.touches[0].clientY); });
canvas.addEventListener('touchend',()=>{ if(aiming){aiming=false; startShoot();}});
canvas.addEventListener('mousedown',e=>{initAudio(); aiming=true; updateAim(e.clientX,e.clientY);}); canvas.addEventListener('mousemove',e=>{if(aiming) updateAim(e.clientX,e.clientY);}); canvas.addEventListener('mouseup',()=>{if(aiming){aiming=false; startShoot();}});

function startShoot(){ if(bricks.filter(b=>!b.dead).length==0) return; shooting=true; toShoot=ballCount; shot=0; shootTimer=0; balls=[]; nextX=null; playSound('shoot'); }
function recallBalls(){ balls.forEach(b=>{ if(b.active){ b.active=false; if(nextX===null) nextX=b.x; }}); }
function toggleSpeed(){ speedMult=speedMult==1?2:speedMult==2?3:1; document.getElementById('speedBtn').innerText='SPEED x'+speedMult; }

// --- AD SYSTEM OFFLINE + ONLINE ---
function showAd(){
  initAudio();
  let isOnline=navigator.onLine;
  let ad=document.createElement('div');
  ad.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;color:white';

  if(isOnline){
    // ONLINE AD - AdSense Simulation + Real Earning
    ad.innerHTML=`
      <div style="background:#111f3a;padding:18px;border-radius:15px;text-align:center;border:2px solid #1e90ff;width:88%;max-width:340px">
        <div style="background:white;color:black;padding:10px;border-radius:8px;margin-bottom:12px;font-size:12px">
          <b>🔵 AdSense Ad</b><br>BBTAN Game - Best Puzzle Game!<br><small>Ad will close in <span id="adTimer">3</span>s</small>
          <div style="margin-top:8px;background:#eee;height:80px;display:flex;align-items:center;justify-content:center">YOUR ADSENSE CODE HERE<br>ca-pub-XXXXXXXX</div>
        </div>
        <h3>🎁 +15 Balls Reward!</h3><p style="font-size:12px;margin:6px 0">Earning: $0.05 (Online)</p>
        <button id="adBtn" disabled style="background:gray;border:none;padding:12px;border-radius:20px;color:white;font-weight:bold;width:100%">Wait 3s...</button>
      </div>`;
  }else{
    // OFFLINE AD - Local Reward
    ad.innerHTML=`
      <div style="background:#111f3a;padding:18px;border-radius:15px;text-align:center;border:2px solid #ffaa00;width:88%;max-width:340px">
        <div style="background:#222;padding:10px;border-radius:8px;margin-bottom:12px">
          <b>📴 Offline Bonus</b><br><small>No internet - Local reward!</small><br>
          <div style="margin-top:8px;background:#333;height:60px;display:flex;align-items:center;justify-content:center">⭐ OFFLINE REWARD ⭐</div>
        </div>
        <h3>🎁 +10 Balls!</h3><p style="font-size:12px;margin:6px 0">Offline mode - No earning</p>
        <button id="adBtn" style="background:linear-gradient(90deg,orange,red);border:none;padding:12px;border-radius:20px;color:white;font-weight:bold;width:100%">Collect +10</button>
      </div>`;
  }

  document.body.appendChild(ad);
  if(isOnline){
    let t=3; let timer=setInterval(()=>{ t--; let el=document.getElementById('adTimer'); if(el) el.innerText=t; let btn=document.getElementById('adBtn'); if(t<=0){ clearInterval(timer); btn.disabled=false; btn.style.background='linear-gradient(90deg,orange,red)'; btn.innerText='Close & Get +15 Balls'; } else { btn.innerText='Wait '+t+'s...'; } },1000);
    ad.querySelector('#adBtn').onclick=()=>{ ad.remove(); ballCount+=15; updateUI(); playSound('bonus'); };
  }else{
    ad.querySelector('#adBtn').onclick=()=>{ ad.remove(); ballCount+=10; updateUI(); playSound('bonus'); };
  }
}

function claimBonus(){ showAd(); }
function updateUI(){ document.getElementById('info').innerText=`STAGE:${stage} | Score:${score} | Balls:x${ballCount}`; }

function loop(){
  ctx.save(); if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.85; if(shake<0.5) shake=0; }
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=nextX!==null?'#00ff88':'#ff2d2d'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10; ctx.fillRect(0,H-85,W,2.5); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.fillStyle='white'; ctx.arc(shootX,H-90,6,0,Math.PI*2); ctx.fill();
  if(aiming){ ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.5; ctx.setLineDash([8,6]); ctx.beginPath(); ctx.moveTo(shootX,H-90); let len=320; ctx.lineTo(shootX+Math.cos(aimAngle)*len,H-90+Math.sin(aimAngle)*len); ctx.stroke(); ctx.setLineDash([]); for(let i=0;i<6;i++){ let px=shootX+Math.cos(aimAngle)*(14+i*12), py=H-90+Math.sin(aimAngle)*(14+i*12); ctx.beginPath(); ctx.fillStyle='rgba(255,255,255,'+(0.9-i*0.14)+')'; ctx.arc(px,py,4,0,Math.PI*2); ctx.fill(); } }
  if(shooting){ shootTimer++; if(shootTimer>=3&&shot<toShoot){ balls.push(new Ball(shootX,H-90,aimAngle)); shot++; shootTimer=0; } if(shot>=toShoot&&balls.every(b=>!b.active)){ shooting=false; if(nextX!==null) shootX=nextX; bricks=bricks.filter(b=>!b.dead); if(bricks.length==0){ stage++; createStage(); } else{ bricks.forEach(b=>b.y+=44); if(bricks.some(b=>b.y+b.h>H-92)){ alert('Game Over! Score:'+score); stage=1; score=0; ballCount=35; shootX=W/2; createStage(); } } updateUI(); } }
  bricks.forEach(b=>{ if(!b.dead) b.draw(); }); particles.forEach((p,i)=>{ p.x+=p.vx; p.y+=p.vy; p.life--; p.draw(); if(p.life<=0) particles.splice(i,1); }); floatTexts.forEach((f,i)=>{ f.y-=1.2; f.life--; ctx.fillStyle='white'; ctx.font='bold 12px Arial'; ctx.fillText(f.txt,f.x,f.y); if(f.life<=0) floatTexts.splice(i,1); }); balls.forEach(b=>{ b.update(); b.draw(); });
  ctx.restore(); requestAnimationFrame(loop);
}
loop(); updateUI();

// Register offline Service Worker for full offline
if('serviceWorker' in navigator){
  let swCode=`self.addEventListener('install',e=>{self.skipWaiting()}); self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))})`;
  let blob=new Blob([swCode],{type:'text/javascript'}); let swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
</body>
  </html>
