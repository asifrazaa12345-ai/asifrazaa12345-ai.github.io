<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bricks Breaker Quest - FIXED V2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
  body{background:#0a0a1a;color:white;font-family:Arial;overflow:hidden;display:flex;flex-direction:column;height:100vh;}
  .top-bar{display:flex;justify-content:space-between;padding:8px 10px;background:#111;border-bottom:2px solid #ffaa00;font-size:12px;font-weight:bold;}
  .ad-banner{background:#1a1a00;text-align:center;padding:6px;border:1px solid #ffaa00;color:#ffaa00;font-size:12px;cursor:pointer;}
  #gameContainer{flex:1;position:relative;background:radial-gradient(circle at center, #1a1a3a 0%, #0a0a1a 100%);overflow:hidden;}
  #gameCanvas{width:100%;height:100%;display:block;}
  .bottom-bar{background:#111;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-top:1px solid #333;font-size:11px;}
  .ad-modal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100;}
  .ad-box{background:white;color:black;width:85%;max-width:320px;padding:20px;text-align:center;border-radius:10px;}
  .close-ad{background:#6c5ce7;color:white;border:none;padding:10px 20px;border-radius:20px;margin-top:15px;font-weight:bold;cursor:pointer;width:100%;}
</style>
</head>
<body>
<div class="top-bar"><div>BRICKS BREAKER QUEST</div><div id="stats">STAGE-10 | Score:0 | Line:1</div></div>
<div class="ad-banner" onclick="triggerAd(1)">🔥 AD 1 - Click Here - Earning Banner Ad 🔥</div>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="adModal" class="ad-modal">
    <h2 style="color:#ffdd00;margin-bottom:15px;">📢 Advertisement Playing...</h2>
    <div class="ad-box"><p style="font-size:16px;font-weight:bold;">Your Ad Here<br>Earning $0.05 per view</p><p id="adTimer" style="margin-top:15px;font-size:13px;color:#555;">Ad ends in 5s...</p><button class="close-ad" onclick="closeAd()">Close Ad & Get Reward</button></div>
  </div>
</div>
<div class="bottom-bar"><div onclick="triggerAd(2)" style="color:#ffaa00;cursor:pointer;">▶ Watch Ad +15 balls! (AD 2)</div><div id="ballCount" style="background:#ff00ff;padding:4px 10px;border-radius:12px;">x50</div></div>
<script>
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let W,H,dpr;function resize(){dpr=window.devicePixelRatio||1;W=canvas.clientWidth=canvas.parentElement.clientWidth;H=canvas.clientHeight=canvas.parentElement.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);BRICK_W=(W-50)/6;BRICK_H=38;}window.addEventListener('resize',resize);let bricks=[],balls=[],particles=[],score=0,line=1,ballCount=50,isAiming=true,isShooting=false,aimAngle=-Math.PI/2,shootX=0,shootY=0,ballsReturned=0,lastAdTime=0;const COLS=6;let BRICK_W=50,BRICK_H=38;const GAP=6,BOTTOM_LINE=0.88;function initBricks(){bricks=[];for(let r=0;r<4;r++)addNewRow(r);shootX=W/2;shootY=H*0.92;}function addNewRow(rowIndex=0){let y=60+rowIndex*(BRICK_H+GAP);for(let c=0;c<COLS;c++){if(Math.random()>0.35){let type=['rect','tri','circle'][Math.floor(Math.random()*3)];let val=Math.floor(Math.random()*20)+5+line;bricks.push({x:10+c*(BRICK_W+GAP),y:y,w:BRICK_W,h:BRICK_H,val:val,maxVal:val,type:type,color:type==='rect'?'#ff8c42':type==='tri'?'#ffd93d':'#00e5ff'});}}}function moveBricksDown(){for(let b of bricks)b.y+=(BRICK_H+GAP);line++;addNewRow(0);updateStats();}function updateStats(){document.getElementById('stats').innerText=`STAGE-10 | Score:${score} | Line:${line}`;document.getElementById('ballCount').innerText='x'+ballCount;}function getAngle(mx,my){let dx=mx-shootX,dy=my-shootY,ang=Math.atan2(dy,dx);if(ang>-0.15)ang=-0.15;if(ang<-Math.PI+0.15)ang=-Math.PI+0.15;return ang;}canvas.addEventListener('pointerdown',e=>{if(isShooting)return;const rect=canvas.getBoundingClientRect();aimAngle=getAngle(e.clientX-rect.left,e.clientY-rect.top);});canvas.addEventListener('pointermove',e=>{if(isShooting)return;const rect=canvas.getBoundingClientRect();aimAngle=getAngle(e.clientX-rect.left,e.clientY-rect.top);});canvas.addEventListener('pointerup',e=>{if(isShooting)return;shoot();});function shoot(){if(isShooting)return;isShooting=true;isAiming=false;balls=[];ballsReturned=0;let angle=aimAngle;for(let i=0;i<ballCount;i++){setTimeout(()=>{balls.push({x:shootX,y:shootY,vx:Math.cos(angle)*8,vy:Math.sin(angle)*8,active:true});},i*70);}setTimeout(checkAllReturned,3000);}function checkAllReturned(){let check=setInterval(()=>{if(balls.length===0||(ballsReturned>=ballCount&&balls.every(b=>!b.active))){clearInterval(check);isShooting=false;isAiming=true;balls=[];moveBricksDown();}},300);}function updateBalls(){for(let b of balls){if(!b.active)continue;b.x+=b.vx;b.y+=b.vy;if(b.x<5){b.x=5;b.vx*=-1;}if(b.x>W-5){b.x=W-5;b.vx*=-1;}if(b.y<50){b.y=50;b.vy*=-1;}if(b.y>H*0.92){b.active=false;ballsReturned++;if(ballsReturned===1)shootX=b.x;continue;}for(let br of bricks){if(br.val<=0)continue;if(b.x>br.x&&b.x<br.x+br.w&&b.y>br.y&&b.y<br.y+br.h){br.val--;score+=10;b.vy*=-1;b.vx+=(Math.random()-0.5)*1;if(br.val<=0)particles.push({x:br.x+br.w/2,y:br.y+br.h/2,life:15});break;}}}bricks=bricks.filter(br=>br.val>0);balls=balls.filter(b=>b.active||ballsReturned<ballCount);}function draw(){ctx.clearRect(0,0,W,H);if(isAiming&&!isShooting){ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(shootX,shootY);let len=400,ex=shootX+Math.cos(aimAngle)*len,ey=shootY+Math.sin(aimAngle)*len;ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);for(let i=0;i<10;i++){let t=i/10,x=shootX+Math.cos(aimAngle)*len*t,y=shootY+Math.sin(aimAngle)*len*t;ctx.fillStyle='white';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.fillStyle='white';ctx.shadowColor='white';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(shootX,shootY,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}for(let br of bricks){let pct=br.val/br.maxVal;ctx.globalAlpha=0.3+pct*0.7;ctx.fillStyle=br.color;ctx.shadowColor=br.color;ctx.shadowBlur=12;if(br.type==='rect'){ctx.fillRect(br.x,br.y,br.w,br.h);}else if(br.type==='circle'){let cx=br.x+br.w/2,cy=br.y+br.h/2,r=Math.min(br.w,br.h)/2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();}else{ctx.beginPath();ctx.moveTo(br.x,br.y+br.h);ctx.lineTo(br.x+br.w/2,br.y);ctx.lineTo(br.x+br.w,br.y+br.h);ctx.closePath();ctx.fill();}ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle='white';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(br.val,br.x+br.w/2,br.y+br.h/2+4);}for(let b of balls){ctx.fillStyle='#FFFFFF';ctx.shadowColor='#FFFFFF';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}for(let p of particles){p.life--;ctx.globalAlpha=p.life/15;ctx.fillStyle='yellow';ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,0,100,0.3)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(0,H*BOTTOM_LINE);ctx.lineTo(W,H*BOTTOM_LINE);ctx.stroke();ctx.setLineDash([]);}function loop(){updateBalls();draw();requestAnimationFrame(loop);}resize();initBricks();updateStats();loop();let adTimerInt;function triggerAd(type){let now=Date.now();if(now-lastAdTime<30000&&type===2){alert('Wait 30 sec for next ad!');return;}document.getElementById('adModal').style.display='flex';let t=5;document.getElementById('adTimer').innerText=`Ad ends in ${t}s... Earning $0.04`;adTimerInt=setInterval(()=>{t--;if(t>0)document.getElementById('adTimer').innerText=`Ad ends in ${t}s... Earning $0.04`;else{document.getElementById('adTimer').innerText='Reward Ready! Click Close';clearInterval(adTimerInt);}},1000);}function closeAd(){clearInterval(adTimerInt);document.getElementById('adModal').style.display='none';ballCount+=15;updateStats();lastAdTime=Date.now();let div=document.createElement('div');div.style.position='absolute';div.style.top='50%';div.style.left='50%';div.style.transform='translate(-50%,-50%)';div.style.background='#00ff88';div.style.color='black';div.style.padding='12px 20px';div.style.borderRadius='20px';div.style.fontWeight='bold';div.style.zIndex='200';div.innerText='✅ +15 Balls! Earning $0.05';document.getElementById('gameContainer').appendChild(div);setTimeout(()=>div.remove(),1500);}
</script>
</body>
</html>
