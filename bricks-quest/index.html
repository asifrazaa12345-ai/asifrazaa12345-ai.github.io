<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BRICKS BREAKER QUEST</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0a1628;color:white;font-family:Arial;overflow:hidden}
#topBar{display:flex;justify-content:space-between;padding:8px 12px;background:#111f3a;font-size:12px;font-weight:bold}
#bonusBar{background:linear-gradient(90deg,orange,red);text-align:center;padding:6px;font-size:13px;font-weight:bold;cursor:pointer}
canvas{display:block;background:#0a1628}
#controls{position:fixed;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px}
.btn{padding:10px 18px;border-radius:20px;border:none;font-weight:bold;color:white;cursor:pointer}
#speedBtn{background:#1e90ff}
#recallBtn{background:white;color:black}
</style>
</head>
<body>
<div id="topBar">
  <span>BRICKS BREAKER QUEST</span>
  <span id="info">STAGE:1 | Score:0 | Balls:x20</span>
</div>
<div id="bonusBar" onclick="claimBonus()">🎁 CLAIM BONUS +15 Balls - Tap Here!</div>
<canvas id="game"></canvas>
<div id="controls">
  <button class="btn" id="speedBtn" onclick="toggleSpeed()">SPEED x1</button>
  <button class="btn" id="recallBtn" onclick="recallBalls()">⚡ TAP TO RECALL</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight-90;}
resize(); window.addEventListener('resize',resize);

let balls=[], bricks=[], particles=[];
let ballCount=20, score=0, stage=1, line=1;
let shootPos={x:0,y:0}, aiming=false, aimAngle=0;
let shooting=false, ballsToShoot=0, shootIndex=0, shootTimer=0;
let speedMult=1;
let gameOverLine = H - 120;

// Brick class SQUARE
class Brick{
  constructor(x,y,hp){
    this.x=x; this.y=y; this.w=55; this.h=55;
    this.hp=hp; this.maxHp=hp;
  }
  draw(){
    // Square chakor brick
    let pct = this.hp/this.maxHp;
    ctx.fillStyle = pct>0.6? '#1e90ff' : pct>0.3? '#ffaa00' : '#ff3333';
    ctx.fillRect(this.x,this.y,this.w,this.h);
    ctx.strokeStyle='#0a1628'; ctx.lineWidth=3;
    ctx.strokeRect(this.x,this.y,this.w,this.h);
    ctx.fillStyle='white'; ctx.font='bold 18px Arial';
    ctx.textAlign='center';
    ctx.fillText(this.hp, this.x+this.w/2, this.y+this.h/2+6);
  }
}

// Ball class
class Ball{
  constructor(x,y,angle){
    this.x=x; this.y=y;
    this.vx=Math.cos(angle)*6;
    this.vy=Math.sin(angle)*6;
    this.r=8; this.active=true; this.collected=false;
  }
  update(){
    if(!this.active || this.collected) return;
    this.x+=this.vx*speedMult;
    this.y+=this.vy*speedMult;

    // Wall bounce left/right
    if(this.x-this.r<0 || this.x+this.r>W){ this.vx*=-1; this.x=Math.max(this.r, Math.min(W-this.r,this.x)); }
    // Top bounce
    if(this.y-this.r<0){ this.vy*=-1; this.y=this.r; }

    // Bottom - COLLECT, NOT BOUNCE - YAHAN FIX HAI
    if(this.y+this.r > H-80){
      this.collected=true;
      this.active=false;
      // First ball decides next shoot position
      if(!shootPos.nextX) shootPos.nextX=this.x;
      return;
    }

    // Brick collision SQUARE
    for(let b of bricks){
      if(this.x+this.r > b.x && this.x-this.r < b.x+b.w && this.y+this.r > b.y && this.y-this.r < b.y+b.h){
        b.hp--;
        // Bounce logic
        let overlapLeft = (this.x+this.r) - b.x;
        let overlapRight = (b.x+b.w) - (this.x-this.r);
        let overlapTop = (this.y+this.r) - b.y;
        let overlapBottom = (b.y+b.h) - (this.y-this.r);
        let minOverlap = Math.min(overlapLeft,overlapRight,overlapTop,overlapBottom);
        if(minOverlap==overlapLeft || minOverlap==overlapRight) this.vx*=-1;
        else this.vy*=-1;
        if(b.hp<=0) { score+=10; }
        break;
      }
    }
  }
  draw(){
    if(!this.active) return;
    ctx.beginPath(); ctx.fillStyle='white';
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.shadowColor='white'; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;
  }
}

function createStage(){
  bricks=[];
  let rows = 2 + Math.floor(stage/2);
  for(let row=0; row<rows; row++){
    let cols = 5;
    for(let c=0;c<cols;c++){
      if(Math.random()>0.4){
        let x = 15 + c*(W/5);
        let y = 70 + row*65;
        bricks.push(new Brick(x,y, stage*3 + Math.floor(Math.random()*10)+5));
      }
    }
  }
}
createStage();
shootPos.x=W/2; shootPos.y=H-90; shootPos.nextX=null;

canvas.addEventListener('touchstart', e=>{
  if(shooting) return;
  let t=e.touches[0];
  aiming=true;
  updateAim(t.clientX,t.clientY);
});
canvas.addEventListener('touchmove', e=>{
  if(!aiming) return;
  let t=e.touches[0];
  updateAim(t.clientX,t.clientY);
});
canvas.addEventListener('touchend', ()=>{
  if(!aiming) return;
  aiming=false; startShoot();
});
canvas.addEventListener('mousedown', e=>{ aiming=true; updateAim(e.clientX,e.clientY); });
canvas.addEventListener('mousemove', e=>{ if(aiming) updateAim(e.clientX,e.clientY); });
canvas.addEventListener('mouseup', ()=>{ if(aiming){ aiming=false; startShoot(); }});

function updateAim(mx,my){
  let dx=mx-shootPos.x;
  let dy=my-shootPos.y;
  if(dy> -10) dy=-10; // Always up
  aimAngle=Math.atan2(dy,dx);
}
function startShoot(){
  if(bricks.length==0) return;
  shooting=true; ballsToShoot=ballCount; shootIndex=0; shootTimer=0;
  shootPos.nextX=null;
  balls=[];
}

function recallBalls(){
  balls.forEach(b=>{ if(b.active){ b.collected=true; b.active=false; if(!shootPos.nextX) shootPos.nextX=b.x; }});
}

function toggleSpeed(){
  speedMult = speedMult==1?2: speedMult==2?3:1;
  document.getElementById('speedBtn').innerText='SPEED x'+speedMult;
  document.getElementById('info').innerText=`STAGE:${stage} | Score:${score} | Balls:x${ballCount}`;
}

function claimBonus(){
  // Ad popup simulation
  let ad = document.createElement('div');
  ad.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999';
  ad.innerHTML=`<div style="background:#111f3a;padding:20px;border-radius:15px;text-align:center;border:2px solid #1e90ff;width:80%"><h3>🎁 +15 Balls!</h3><p style="margin:10px 0">Earning $0.05</p><button style="background:linear-gradient(90deg,orange,red);border:none;padding:10px 20px;border-radius:20px;color:white;font-weight:bold;width:100%" onclick="this.parentElement.parentElement.remove();addBalls()">Close & Get Reward</button></div>`;
  document.body.appendChild(ad);
}
function addBalls(){ ballCount+=15; updateUI(); }

function updateUI(){
  document.getElementById('info').innerText=`STAGE:${stage} | Score:${score} | Line:${line} | Balls:x${ballCount}`;
}

function gameLoop(){
  ctx.clearRect(0,0,W,H);

  // Draw shoot pos
  ctx.beginPath(); ctx.fillStyle='white'; ctx.arc(shootPos.x, H-90, 10,0,Math.PI*2); ctx.fill();

  // Aiming line
  if(aiming){
    ctx.setLineDash([8,8]); ctx.strokeStyle='white'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(shootPos.x,H-90);
    let len=150; ctx.lineTo(shootPos.x+Math.cos(aimAngle)*len, H-90+Math.sin(aimAngle)*len); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Shoot balls one by one
  if(shooting){
    shootTimer++;
    if(shootTimer>5 && shootIndex<ballsToShoot){
      balls.push(new Ball(shootPos.x,H-90,aimAngle + (Math.random()-0.5)*0.05));
      shootIndex++; shootTimer=0;
    }
    if(shootIndex>=ballsToShoot && balls.every(b=>!b.active)) {
      shooting=false;
      if(shootPos.nextX) shootPos.x=shootPos.nextX;
      // Remove dead bricks
      bricks=bricks.filter(b=>b.hp>0);
      if(bricks.length==0){ stage++; line++; createStage(); }
      else {
        // Move bricks down
        bricks.forEach(b=>b.y+=65); line++;
        if(bricks.some(b=>b.y+b.h > H-100)){ alert('Game Over! Score:'+score); stage=1; score=0; line=1; createStage(); }
      }
      updateUI();
    }
  }

  bricks.forEach(b=>{ if(b.hp>0) b.draw(); });
  balls.forEach(b=>{ b.update(); b.draw(); });

  // Game over line
  ctx.strokeStyle='red'; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(0,H-100); ctx.lineTo(W,H-100); ctx.stroke(); ctx.setLineDash([]);

  requestAnimationFrame(gameLoop);
}
gameLoop();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
