<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRICKS BREAKER QUEST - FINAL V3</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0a0e1a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#topbar{display:flex;justify-content:space-between;padding:6px 10px;background:#111a2e;font-size:12px;border-bottom:2px solid #1e3a5f}
#adBanner{background:linear-gradient(90deg,#ff6a00,#ee0979);text-align:center;padding:8px;font-weight:bold;cursor:pointer;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.7}}
canvas{display:block;margin:0 auto;background:radial-gradient(#141e35,#0a0e1a)}
#controls{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:6px;background:#111a2e}
.btn{padding:8px 16px;border:none;border-radius:20px;font-weight:bold;cursor:pointer}
#speedBtn{background:#00d2ff;color:#000}
#recallBtn{background:#fff;color:#000;border:2px solid #00ff88}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100}
.modal.active{display:flex}
.box{background:#1a2540;padding:20px;border-radius:15px;text-align:center;min-width:280px;border:2px solid #00d2ff}
.box button{margin-top:12px;padding:10px 20px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;width:100%}
.primary{background:linear-gradient(90deg,#00d2ff,#3a7bd5);color:#fff}
.reward{background:linear-gradient(90deg,#ff6a00,#ee0979);color:#fff}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#00ff88;color:#000;padding:12px 20px;border-radius:25px;font-weight:bold;display:none;z-index:200}
</style>
</head>
<body>
<div id="topbar"><span>BRICKS BREAKER QUEST</span><span id="stats">STAGE:10 | Score:0 | Line:1 | Balls:x20</span></div>
<div id="adBanner" onclick="showAd()">🎁 CLAIM BONUS +15 Balls - Tap Here! 🎁</div>
<canvas id="game"></canvas>
<div id="controls"><button class="btn" id="speedBtn" onclick="toggleSpeed()">⚡ SPEED x1</button><button class="btn" id="recallBtn" onclick="recallBalls()">👇 TAP TO RECALL</button></div>
<div id="adModal" class="modal"><div class="box"><h2>📢 Advertisement Playing...</h2><p id="adText">Your Ad Here<br>Earning $0.05 per view</p><p id="adTimer">Ad ends in 5s...</p><button class="reward" onclick="closeAd()">Close Ad & Get Reward</button></div></div>
<div id="gameOverModal" class="modal"><div class="box"><h2>💀 GAME OVER</h2><p>Bricks reached bottom!</p><p id="finalScore"></p><button class="reward" onclick="watchAdToContinue()">📺 Watch Ad to Continue (+15 Balls)</button><button class="primary" onclick="restartGame()" style="margin-top:8px;background:#555">🔄 Restart</button></div></div>
<div id="toast"></div>
<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight-90;}resize();window.addEventListener('resize',resize);
let audioCtx;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(f,t,d,v=0.3){try{initAudio();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);}catch(e){}}
const SFX={shoot:()=>playSound(800,'square',0.12,0.25),hit:()=>playSound(400,'sine',0.08,0.2),brk:()=>playSound(1200,'triangle',0.2,0.3),recall:()=>playSound(300,'sawtooth',0.3,0.25),ad:()=>playSound(600,'sine',0.5,0.3)};
let bricks=[],balls=[];let shooter={x:0,y:0};let ballCount=20,score=0,line=1,stage=10;let isAiming=false,isShooting=false,aimStart=null,aimEnd=null,gameSpeed=1;
function resetShooter(){shooter.x=canvas.width/2;shooter.y=canvas.height-18;}resetShooter();
function createBricks(){bricks=[];const rows=2+Math.floor(line/3);for(let r=0;r<rows;r++){for(let c=0;c<6;c++){if(Math.random()<0.65){bricks.push({x:c*(canvas.width/6)+8,y:r*55+80,w:46,h:46,hp:Math.floor(10+line*1.5+Math.random()*10),type:'circle'});}}}}createBricks();
function drawBricks(){bricks.forEach(b=>{if(b.hp<=0)return;const cx=b.x+b.w/2,cy=b.y+b.h/2;ctx.beginPath();ctx.arc(cx,cy,b.w/2,0,Math.PI*2);ctx.fillStyle=b.hp>15?'#00aaff':'#00d2ff';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(b.hp,b.x+b.w/2,b.y+b.h/2+5);});}
function drawShooter(){ctx.beginPath();ctx.arc(shooter.x,shooter.y,12,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#00ff88';ctx.beginPath();ctx.arc(shooter.x,shooter.y,5,0,Math.PI*2);ctx.fill();}
function drawAim(){if(!isAiming||!aimStart||!aimEnd)return;let dx=aimEnd.x-aimStart.x,dy=aimEnd.y-aimStart.y;let angle=Math.atan2(dy,dx);let deg=angle*180/Math.PI;if(deg>-15&&deg<15)deg=15;if(deg>165||deg<-165)deg=165;angle=deg*Math.PI/180;const len=Math.min(Math.hypot(dx,dy),220);const ex=shooter.x+Math.cos(angle)*len,ey=shooter.y+Math.sin(angle)*len;ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(shooter.x,shooter.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,4,0,Math.PI*2);ctx.fill();}
function shoot(angle){if(isShooting)return;isShooting=true;SFX.shoot();balls=[];for(let i=0;i<ballCount;i++){setTimeout(()=>{balls.push({x:shooter.x,y:shooter.y,vx:Math.cos(angle)*13,vy:Math.sin(angle)*13,active:true});},i*35);}}
function recallBalls(){if(!isShooting)return;SFX.recall();balls.forEach(b=>{b.vx=(shooter.x-b.x)*0.22;b.vy=(shooter.y-b.y)*0.22;b.recalling=true;});showToast("⚡ Balls Recalled!");setTimeout(()=>{finishTurn();},300);}
function finishTurn(){isShooting=false;balls=[];line++;score+=ballCount;if(bricks.length<8)createBricks();else{bricks.forEach(b=>b.y+=55);if(bricks.some(b=>b.y+b.h>=shooter.y-10)){showGameOver();return;}for(let c=0;c<6;c++)if(Math.random()<0.5)bricks.push({x:c*(canvas.width/6)+8,y:80,w:46,h:46,hp:Math.floor(10+line*1.8),type:'circle'});}updateStats();resetShooter();}
function updateStats(){document.getElementById('stats').innerText=`STAGE:${stage} | Score:${score} | Line:${line} | Balls:x${ballCount}`;}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',1500);}
let adTimerInt;function showAd(){if(!navigator.onLine){showToast("📴 Offline - Ad will show when online");return;}SFX.ad();document.getElementById('adModal').classList.add('active');let sec=5;let earn=0;document.getElementById('adTimer').innerText=`Ad ends in ${sec}s... Earning $${earn.toFixed(2)}`;adTimerInt=setInterval(()=>{sec--;earn+=0.01;document.getElementById('adTimer').innerText=sec>0?`Ad ends in ${sec}s... Earning $${earn.toFixed(2)}`:`Reward Ready!`;if(sec<=0)clearInterval(adTimerInt);},1000);}
function closeAd(){clearInterval(adTimerInt);document.getElementById('adModal').classList.remove('active');ballCount+=15;updateStats();showToast("✅ +15 Balls! Earning $0.05");SFX.brk();}
function showGameOver(){document.getElementById('finalScore').innerText=`Score: ${score} | Line: ${line}`;document.getElementById('gameOverModal').classList.add('active');}
function watchAdToContinue(){document.getElementById('gameOverModal').classList.remove('active');showAd();setTimeout(()=>{bricks=bricks.filter(b=>b.y<shooter.y-60);},500);}
function restartGame(){document.getElementById('gameOverModal').classList.remove('active');score=0;line=1;ballCount=20;bricks=[];createBricks();resetShooter();isShooting=false;balls=[];updateStats();}
function toggleSpeed(){gameSpeed=gameSpeed===1?2:1;document.getElementById('speedBtn').innerText=gameSpeed===1?"⚡ SPEED x1":"⚡ SPEED x2";showToast(gameSpeed===2?"Speed x2!":"Speed x1");}
function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255,0,80,0.6)';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,shooter.y+18);ctx.lineTo(canvas.width,shooter.y+18);ctx.stroke();ctx.setLineDash([]);drawBricks();drawShooter();drawAim();for(let s=0;s<gameSpeed;s++){for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(!b.active)continue;b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>canvas.width-8){b.vx*=-1;b.x=Math.max(8,Math.min(canvas.width-8,b.x));SFX.hit();}if(b.y<70){b.vy*=-1;b.y=70;SFX.hit();}for(let br of bricks){if(br.hp<=0)continue;let cx=br.x+br.w/2,cy=br.y+br.h/2;if(Math.hypot(b.x-cx,b.y-cy)<br.w/2+8){br.hp--;if(br.hp<=0){SFX.brk();score+=10;}else SFX.hit();b.vy*=-1;break;}}if(b.y>shooter.y-5&&!b.recalling){if(Math.abs(b.x-shooter.x)<40){b.active=false;balls.splice(i,1);if(balls.length===0)finishTurn();}else b.vy*=-1;}if(b.recalling&&Math.hypot(b.x-shooter.x,b.y-shooter.y)<15){b.active=false;balls.splice(i,1);if(balls.length===0)finishTurn();}}}balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowBlur=8;ctx.shadowColor='#fff';ctx.fill();ctx.shadowBlur=0;});requestAnimationFrame(loop);}
canvas.addEventListener('pointerdown',e=>{if(isShooting){recallBalls();return;}initAudio();const r=canvas.getBoundingClientRect();aimStart={x:e.clientX-r.left,y:e.clientY-r.top};isAiming=true;});
canvas.addEventListener('pointermove',e=>{if(!isAiming)return;const r=canvas.getBoundingClientRect();aimEnd={x:e.clientX-r.left,y:e.clientY-r.top};});
canvas.addEventListener('pointerup',e=>{if(!isAiming)return;isAiming=false;const r=canvas.getBoundingClientRect();aimEnd={x:e.clientX-r.left,y:e.clientY-r.top};let dx=aimEnd.x-shooter.x,dy=aimEnd.y-shooter.y;let angle=Math.atan2(dy,dx);if(dy>-10)return;let deg=angle*180/Math.PI;if(deg>-15&&deg<0)deg=-15;if(deg>0&&deg<15)deg=-15;if(deg<-165)deg=-165;if(deg>165)deg=165;if(deg>0)deg=-165+(180-deg);angle=deg*Math.PI/180;shoot(angle);});
updateStats();loop();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>console.log("Offline Ready!"));
}
</script>
</body>
</html>
