skipAdBtn" style="display:none">Claim Reward >></button></div></div><div id="toast"></div></div></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=window.devicePixelRatio||1;function resize(){const r=document.getElementById('gameWrap').getBoundingClientRect();W=r.width;H=window.innerHeight-54-36-38-62;if(H<300)H=400;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}window.addEventListener('resize',resize);
let audioCtx=null,soundOn=true;function initAudio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();}}function playTone(freq,type,dur,vol){if(!soundOn)return;initAudio();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol||0.18;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);}function sfxShoot(){playTone(220,'square',0.12,0.25);setTimeout(()=>playTone(440,'square',0.1,0.2),60);}function sfxHit(){playTone(800+Math.random()*400,'sine',0.08,0.18);}function sfxBreak(){playTone(120,'sawtooth',0.25,0.3);setTimeout(()=>playTone(600,'sine',0.2,0.25),80);}function sfxWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.35,0.25),i*140));}function sfxOver(){playTone(200,'sawtooth',0.6,0.3);setTimeout(()=>playTone(100,'sawtooth',0.6,0.3),200);}

let stage=16,score=0,balls=60,bricks=[],ballObjs=[],shooting=false,aim={x:0,y:0,active:false},ballPos={x:200,y:0},particles=[],line=0,earning=0;

function makeLevel(n){bricks=[];particles=[];ballObjs=[];line=0;balls=60+Math.floor((n-12)/2)*10;ballPos={x:W/2,y:H-14};const cols=6,gap=4,bw=(W-12)/cols-gap,bh=42;for(let r=0;r<5;r++)for(let c=0;c<cols;c++){if(Math.random()<0.15)continue;let hp=Math.floor(20+n*1.6+Math.random()*10+r*2);let isTri=Math.random()<0.28;bricks.push({x:6+c*(bw+gap),y:14+r*(bh+gap),w:bw,h:bh,hp,max:hp,isTri,dir:Math.floor(Math.random()*4)});}updateUI();}

function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);for(let b of bricks){let ratio=b.hp/b.max;let col=ratio>0.6?'#8a5cff':ratio>0.3?'#ffb02e':'#ff4a6a';ctx.shadowColor=col;ctx.shadowBlur=16;ctx.beginPath();if(!b.isTri){if(ctx.roundRect)ctx.roundRect(b.x,b.y,b.w,b.h,10);else ctx.rect(b.x,b.y,b.w,b.h);}else{if(b.dir==0){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+b.w,b.y);ctx.lineTo(b.x,b.y+b.h);}else if(b.dir==1){ctx.moveTo(b.x+b.w,b.y);ctx.lineTo(b.x+b.w,b.y+b.h);ctx.lineTo(b.x,b.y);}else if(b.dir==2){ctx.moveTo(b.x,b.y+b.h);ctx.lineTo(b.x+b.w,b.y+b.h);ctx.lineTo(b.x+b.w,b.y);}else{ctx.moveTo(b.x,b.y+b.h);ctx.lineTo(b.x,b.y);ctx.lineTo(b.x+b.w,b.y+b.h);}}ctx.closePath();ctx.fillStyle=col+'33';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='700 13px Orbitron';ctx.textAlign='center';ctx.fillText(Math.floor(b.hp),b.x+b.w/2,b.y+b.h/2+4);}if(aim.active&&!shooting){ctx.setLineDash([6,7]);ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ballPos.x,ballPos.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(aim.x,aim.y,7,0,Math.PI*2);ctx.fill();}for(let b of ballObjs){if(!b.active)continue;b.x+=b.vx;b.y+=b.vy;b.vy+=0.045;if(b.x<7||b.x>W-7){b.vx*=-1;b.x=Math.max(7,Math.min(W-7,b.x));sfxHit();}if(b.y<8){b.vy*=-1;b.y=8;sfxHit();}if(b.y>H-6){b.active=false;ballPos.x=b.x;continue;}for(let br of bricks){if(b.x>br.x-2&&b.x<br.x+br.w+2&&b.y>br.y-2&&b.y<br.y+br.h+2){br.hp-=1;score+=5;if(br.hp<=0){score+=10;sfxBreak();for(let k=0;k<7;k++)particles.push({x:br.x+br.w/2,y:br.y+br.h/2,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20});}else sfxHit();let ol=Math.min(b.x-br.x,br.x+br.w-b.x,b.y-br.y,br.y+br.h-b.y);if(ol==b.y-br.y||ol==br.y+br.h-b.y)b.vy*=-1;else b.vx*=-1;break;}}ctx.fillStyle='#fff';ctx.shadowColor='#8af';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,6.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}bricks=bricks.filter(b=>b.hp>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.life--;ctx.globalAlpha=p.life/20;ctx.fillStyle='#a8f';ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1;}particles=particles.filter(p=>p.life>0);ctx.fillStyle='#fff';ctx.shadowColor='#0ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(ballPos.x,ballPos.y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
setTimeout(()=>{resize();makeLevel(stage);loop();},120);
