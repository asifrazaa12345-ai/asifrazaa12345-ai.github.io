<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0f;color:#fff;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.top-ad{width:100%;max-width:400px;min-height:60px;background:#111;display:flex;align-items:center;justify-content:center;margin:4px 0;border:1px dashed #facc15}
.bottom-ad{width:100%;max-width:400px;min-height:80px;background:#111;border:2px solid #facc15;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:4px 0}
#gameWrap{position:relative;width:100%;max-width:400px}
canvas{background:#15151f;border-radius:14px;display:block;width:100%;box-shadow:0 0 20px rgba(168,85,247,0.2);touch-action:none}
.hud{display:flex;justify-content:space-between;width:100%;max-width:400px;padding:8px 12px;background:#1a1a2e;border-radius:10px;margin:6px 0;font-weight:800;font-size:14px;border:1px solid #2a2a4a}
.hud span{color:#facc15}
.btns{display:flex;gap:8px;margin:8px;flex-wrap:wrap;justify-content:center}
.b{padding:11px 20px;border:none;border-radius:12px;font-weight:900;cursor:pointer;font-size:14px}

</head>
<body>
<div class="top-ad">
<ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-4221911634885249" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>

</div>
<div class="hud">
<div>Balls: <span id="ballCnt">40</span></div>
<div>Earned: <span id="earn">$0.00</span></div>
<div>Level: <span id="lvl">1</span>/5</div>
</div>

<canvas id="c" width="400" height="620"></canvas>
</div>
<div class="btns">
<button class="b bY" id="rewardBtn">+15 Balls +$0.02 (Watch Ad)</button>
<button class="b bR" id="resetBtn">Reset</button>
</div>
<div class="bottom-ad">
<ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-4221911634885249" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
<div style="font-size:10px;color:#facc15;margin-top:4px">V136 REAL - ca-pub-4221911634885249</div>
</div>
<div id="rewardModal">
<div style="background:#1a1a2e;padding:24px;border-radius:18px;text-align:center;max-width:330px;width:92%;border:1px solid #facc15">
<h2 style="color:#facc15;margin-bottom:6px">Watch Ad to Earn</h2>
<div id="countdown" style="font-size:52px;margin:14px 0;font-weight:900">5</div>
<div style="width:100%;background:#333;height:8px;border-radius:4px;overflow:hidden"><div id="prog" style="width:0%;height:100%;background:#facc15;transition:width 1s linear"></div></div>
<div style="margin:14px 0;background:#000;padding:8px;border-radius:8px">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4221911634885249" data-ad-slot="3333333333" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>
<p style="font-size:11px;color:#888">Ad will close after 5 seconds - ID: 4221911634885249</p>
</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=400,H=620;
let bricks=[],balls=[];
let ballCount=40,earn=0,level=1,shooting=false;
let aimX=W/2,aimY=120;
let ballSpeed=9;
let brickW=52,brickH=28,brickGap=4;
let brickStartY=70,brickCols=7,brickRows=6;
function Mk(){
 bricks=[];
 let maxHP=22+level*9;
 for(let r=0;r<brickRows;r++){
  for(let c=0;c<brickCols;c++){
   let x=8 + c*(brickW+brickGap);
   let y=brickStartY + r*(brickH+brickGap);
   let hp=Math.floor(Math.random()*maxHP)+6+level*3;
   let isGold=Math.random()<0.12;
   let color=isGold?'#facc15':`hsl(${265+r*12} 75% ${55+r*2}%)`;
   if(isGold) hp=Math.floor(hp*2.2);
   bricks.push({x,y,w:brickW,h:brickH,hp,max:hp,color,alive:true,isGold});
  }
 }
}
function resetBalls(){
 balls=[];
 for(let i=0;i<ballCount;i++) balls.push({x:W/2,y:H-25,vx:0,vy:0,active:false});
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,0.02)';
 for(let i=0;i<30;i++){ ctx.beginPath(); ctx.arc((i*37)%W,(i*73)%H,1,0,Math.PI*2); ctx.fill(); }
 bricks.forEach(b=>{
  if(!b.alive) return;
  ctx.fillStyle=b.color;
  if(b.isGold){ ctx.shadowColor='#facc15'; ctx.shadowBlur=12; } else { ctx.shadowColor=b.color; ctx.shadowBlur=6; }
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.shadowBlur=0;
  ctx.fillStyle=b.isGold?'#000':'#fff';
  ctx.font='bold 13px system-ui';
  ctx.textAlign='center';
  ctx.fillText(b.hp, b.x+b.w/2, b.y+b.h/2+5);
  ctx.strokeStyle='rgba(255,255,255,0.12)';
  ctx.lineWidth=1;
  ctx.strokeRect(b.x,b.y,b.w,b.h);
 });
 if(!shooting){
  ctx.strokeStyle='rgba(250,204,21,0.5)';
  ctx.setLineDash([2.5,7]);
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(W/2,H-25); ctx.lineTo(aimX,aimY); ctx.stroke();
  ctx.setLineDash([]);
  for(let i=0;i<40;i++){
   let t=i/40;
   let x=W/2 + (aimX-W/2)*t;
   let y=(H-25) + (aimY-(H-25))*t;
   ctx.fillStyle=`rgba(250,204,21,${0.25+t*0.85})`;
   ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
  }
 }
 balls.forEach(b=>{
  if(!b.active){
   if(b===balls[0]){ ctx.fillStyle='#fff'; ctx.shadowColor='#a855f7'; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(W/2,H-25,6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
   return;
  }
  ctx.fillStyle='#ffffff';
  ctx.shadowColor='#a855f7'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(b.x,b.y,6,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
 });
 ctx.strokeStyle='rgba(255,60,60,0.4)';
 ctx.setLineDash([8,6]); ctx.lineWidth=2;
 ctx.beginPath(); ctx.moveTo(0,H-38); ctx.lineTo(W,H-38); ctx.stroke();
 ctx.setLineDash([]); ctx.lineWidth=1;
 ctx.fillStyle='rgba(255,60,60,0.7)'; ctx.font='10px system-ui'; ctx.fillText('DANGER LINE',8,H-44);
}
function collide(){
 balls.forEach(ball=>{
  if(!ball.active) return;
  if(ball.x<6 || ball.x>W-6){ ball.vx*=-1; ball.x=Math.max(6,Math.min(W-6,ball.x)); }
  if(ball.y<6){ ball.vy*=-1; ball.y=6; }
  if(ball.y>H+25){ ball.active=false; return; }
  for(let br of bricks){
   if(!br.alive) continue;
   if(ball.x+6>br.x && ball.x-6<br.x+br.w && ball.y+6>br.y && ball.y-6<br.y+br.h){
    let ol=ball.x+6-br.x, or=br.x+br.w-(ball.x-6), ot=ball.y+6-br.y, ob=br.y+br.h-(ball.y-6);
    let m=Math.min(ol,or,ot,ob);
    if(m===ol){ ball.x=br.x-7; ball.vx*=-1; } else if(m===or){ ball.x=br.x+br.w+7; ball.vx*=-1; }
    else if(m===ot){ ball.y=br.y-7; ball.vy*=-1; } else { ball.y=br.y+br.h+7; ball.vy*=-1; }
    br.hp--;
    if(br.hp<=0) br.alive=false;
    break;
   }
  }
 });
 if(bricks.every(b=>!b.alive)){
  level++;
  earn+=0.01;
  if(level>5){ alert('YOU WIN! Total Earned: $'+earn.toFixed(2)); level=1; earn=0; }
  document.getElementById('lvl').textContent=level;
  document.getElementById('earn').textContent='$'+earn.toFixed(2);
  Mk();
  setTimeout(()=>{ balls.forEach(b=>b.active=false); shooting=false; },350);
 }
 let alive=bricks.filter(b=>b.alive);
 if(alive.length){
  let low=Math.max(...alive.map(b=>b.y+b.h));
  if(low>H-45){ alert('GAME OVER! Bricks reached bottom! Level '+level); Mk(); resetBalls(); ballCount=40; document.getElementById('ballCnt').textContent=ballCount; shooting=false; }
 }
}
function shoot(){
 if(shooting) return;
 shooting=true;
 let dx=aimX-W/2, dy=aimY-(H-25);
 let len=Math.sqrt(dx*dx+dy*dy)||1;
 dx/=len; dy/=len;
 let delay=0;
 balls.forEach(b=>{
  setTimeout(()=>{ b.x=W/2; b.y=H-25; b.vx=dx*ballSpeed; b.vy=dy*ballSpeed; b.active=true; },delay);
  delay+=75;
 });
}
function loop(){
 collide();
 balls.forEach(b=>{ if(b.active){ b.x+=b.vx; b.y+=b.vy; } });
 if(shooting && balls.every(b=>!b.active)) shooting=false;
 draw();
 requestAnimationFrame(loop);
}
canvas.addEventListener('touchmove',e=>{
 e.preventDefault();
 let r=canvas.getBoundingClientRect();
 aimX=(e.touches[0].clientX-r.left)*(W/r.width);
 aimY=(e.touches[0].clientY-r.top)*(H/r.height);
},{passive:false});
canvas.addEventListener('touchstart',e=>{
 e.preventDefault();
 let r=canvas.getBoundingClientRect();
 aimX=(e.touches[0].clientX-r.left)*(W/r.width);
 aimY=(e.touches[0].clientY-r.top)*(H/r.height);
},{passive:false});
canvas.addEventListener('touchend',e=>{ e.preventDefault(); shoot(); });
canvas.addEventListener('mousemove',e=>{
 let r=canvas.getBoundingClientRect();
 aimX=(e.clientX-r.left)*(W/r.width);
 aimY=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('click',()=>{ if(!shooting) shoot(); });
document.getElementById('resetBtn').onclick=()=>{ Mk(); resetBalls(); ballCount=40; earn=0; level=1; document.getElementById('ballCnt').textContent=ballCount; document.getElementById('earn').textContent='$0.00'; document.getElementById('lvl').textContent=level; shooting=false; };
document.getElementById('rewardBtn').onclick=()=>{
 let modal=document.getElementById('rewardModal');
 modal.classList.add('show');
 let cd=5, el=document.getElementById('countdown'), prog=document.getElementById('prog');
 el.textContent=cd; prog.style.width='0%';
 let iv=setInterval(()=>{
  cd--; el.textContent=cd; prog.style.width=((5-cd)/5*100)+'%';
  if(cd<=0){ clearInterval(iv); modal.classList.remove('show');
   ballCount+=15; earn+=0.02;
   document.getElementById('ballCnt').textContent=ballCount;
   document.getElementById('earn').textContent='$'+earn.toFixed(2);
   resetBalls();
  }
 },1000);
};
Mk(); resetBalls(); loop();
</script>
</body>
  </html>
